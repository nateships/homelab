name: omni-on-prem

services:
  omni:
    container_name: omni
    image: "ghcr.io/siderolabs/omni:${OMNI_IMG_TAG}"
    env_file:
      - omni.env
    devices:
      - /dev/net/tun
    volumes:
      - ${ETCD_VOLUME_PATH}:/_out/etcd
      - ${SQLITE_STORAGE_PATH}:/_out/sqlite
      - ${ETCD_ENCRYPTION_KEY}:/omni.asc
      - ${TLS_CERT}:/tls.crt
      - ${TLS_KEY}:/tls.key
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: >
      --account-id=${OMNI_ACCOUNT_UUID}
      --name=${NAME}
      --cert=/tls.crt
      --key=/tls.key
      --machine-api-cert=/tls.crt
      --machine-api-key=/tls.key
      --private-key-source='file:///omni.asc'
      --event-sink-port=${EVENT_SINK_PORT}
      --bind-addr=${BIND_ADDR}
      --machine-api-bind-addr=${MACHINE_API_BIND_ADDR}
      --k8s-proxy-bind-addr=${K8S_PROXY_BIND_ADDR}
      --advertised-api-url=${ADVERTISED_API_URL}
      --advertised-kubernetes-proxy-url=${ADVERTISED_K8S_PROXY_URL}
      --siderolink-api-advertised-url=${SIDEROLINK_ADVERTISED_API_URL}
      --siderolink-wireguard-advertised-addr=${SIDEROLINK_WIREGUARD_ADVERTISED_ADDR}
      --initial-users=${INITIAL_USER_EMAILS}
      --sqlite-storage-path=/_out/sqlite/omni.db
      --workload-proxying-enabled
      --workload-proxying-use-omni-subdomain
      --workload-proxying-subdomain=
      --etcd-backup-s3
      ${AUTH}

  # OIDC identity provider on the tailnet; Omni authenticates against it.
  tsidp:
    container_name: tsidp
    image: ghcr.io/tailscale/tsidp:latest@sha256:cae91835375efcbf75ecb8f9520e3472cda946e3ca9af1df3bce9540902f289e
    # The image's app user cannot write the root-owned named volume.
    user: "0"
    environment:
      TAILSCALE_USE_WIP_CODE: "1"
      TS_HOSTNAME: tsidp
      TS_AUTHKEY: ${TSIDP_AUTHKEY}
      # Required when TS_AUTHKEY is an OAuth client secret
      TS_ADVERTISE_TAGS: tag:tsidp
    volumes:
      - tsidp-data:/var/lib/tsidp
    command: --dir=/var/lib/tsidp
    restart: unless-stopped

  omni-infra-provider:
    container_name: omni-infra-provider
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:latest@sha256:eb2e7bf0932b3d09bb9f2b0c3efdbb7ba84e26381997e6a0942018f163afc5f3
    volumes:
      - ./provider-config.yaml:/config.yaml:ro
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      - omni
    command: >
      --config-file /config.yaml
      --omni-api-endpoint ${ADVERTISED_API_URL}
      --omni-service-account-key ${OMNI_INFRA_PROVIDER_KEY}

volumes:
  tsidp-data:
