# omnictl cluster template sync -v -f cluster.yaml
---
kind: Cluster
name: homelab
kubernetes:
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  version: v1.36.2
talos:
  # renovate: datasource=github-releases depName=siderolabs/talos
  version: v1.13.5
patches:
  # Cilium installed via ArgoCD; disable default CNI and kube-proxy
  - name: disable-default-cni
    inline:
      cluster:
        network:
          cni:
            name: none
        proxy:
          disabled: true
  # MANDATORY on Talos 1.13+: the LifecycleService install/upgrade flow
  # requires an explicit machine.install.disk. Without it, freshly
  # provisioned VMs wedge at stage UPGRADING / configuptodate=false forever
  # with NO error surfaced anywhere. Proxmox virtio-scsi-single + scsi0
  # presents as /dev/sda.
  - name: install-disk
    inline:
      machine:
        install:
          disk: /dev/sda
---
kind: ControlPlane
machineClass:
  name: proxmox-control-plane
  size: 3
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
---
kind: Workers
name: workers
machineClass:
  name: proxmox-worker
  size: 3
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
patches:
  - name: worker-labels
    inline:
      machine:
        nodeLabels:
          node-role.kubernetes.io/worker: ""
