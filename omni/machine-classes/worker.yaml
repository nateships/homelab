---
# omnictl apply -f worker.yaml
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: proxmox-worker
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox
    # Probe the iGPU VF (UHD 770, PCI id 8086:a780) with the xe driver;
    # force_probe is required while xe support for this generation is
    # experimental. Pods request the GPU as gpu.intel.com/xe.
    # site-specific: the a780 device id belongs to this host's iGPU
    kernelargs:
      - xe.force_probe=a780
    metavalues: []
    providerdata: |
      cores: 8
      sockets: 1
      memory: 16384
      disk_size: 100
      cpu_type: host
      network_bridge: vmbr0
      # Same VLAN as the Omni LXC; SideroLink stays on one L2 segment
      vlan: 101
      storage_selector: name == "zpool"
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
      # iGPU SR-IOV: each worker gets one virtual function from the
      # "vGPU" Proxmox resource mapping (7 VFs on the UHD 770; the host
      # keeps the physical function). q35 gives native PCIe; ballooning
      # is off because passthrough pins guest memory anyway.
      # site-specific: the resource mapping name is created by hand in
      # the Proxmox console (docs/SITE.md)
      machine_type: q35
      balloon: false
      pci_devices:
        - mapping: vGPU
          pcie: true
