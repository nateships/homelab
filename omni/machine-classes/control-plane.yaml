---
# omnictl apply -f control-plane.yaml
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: proxmox-control-plane
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox
    kernelargs: []
    metavalues: []
    providerdata: |
      cores: 4
      sockets: 1
      memory: 8192
      disk_size: 60
      network_bridge: vmbr0
      # Adjust to your Proxmox storage; CEL expression
      storage_selector: name == "local-lvm"
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
