# Scan a list of container images with Trivy. Reused by the PR gate
# (changed apps, table output, fails on findings) and the weekly sweep
# (all apps, SARIF output for Code Scanning, report only). Trivy comes
# from mise, so the caller must run mise-action first. Accepted-but-
# unfixable CVEs live in .trivyignore.
name: trivy-scan
description: Scan container images with Trivy at a severity threshold.
inputs:
  images:
    description: Newline-separated image references to scan.
    required: true
  severity:
    description: Comma-separated severities to report.
    default: "HIGH,CRITICAL"
  soft-fail:
    description: "true = report only (exit 0); false = fail on findings."
    default: "false"
  format:
    description: "table (default) or sarif."
    default: "table"
  sarif-dir:
    description: "Directory for per-image SARIF files when format is sarif."
    default: "sarif"
runs:
  using: composite
  steps:
    - name: cache trivy db
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ github.run_id }}
        restore-keys: trivy-db-
    - name: scan
      shell: bash
      # Inputs pass through env, never interpolated into the script, so
      # an image ref cannot inject shell (zizmor template-injection).
      env:
        IMAGES: ${{ inputs.images }}
        SEVERITY: ${{ inputs.severity }}
        SOFT_FAIL: ${{ inputs.soft-fail }}
        FORMAT: ${{ inputs.format }}
        SARIF_DIR: ${{ inputs.sarif-dir }}
      run: |
        set -o pipefail
        code=1
        [ "$SOFT_FAIL" = "true" ] && code=0
        printf '%s\n' "$IMAGES" | sort -u | grep -v '^$' > /tmp/trivy-images.txt
        [ "$FORMAT" = "sarif" ] && mkdir -p "$SARIF_DIR"
        rc=0
        n=0
        while read -r img; do
          n=$((n + 1))
          echo "::group::trivy $img"
          if [ "$FORMAT" = "sarif" ]; then
            trivy image --format sarif -o "$SARIF_DIR/$n.sarif" \
              --severity "$SEVERITY" --ignore-unfixed \
              --no-progress --exit-code "$code" "$img" || rc=1
          else
            trivy image --severity "$SEVERITY" --ignore-unfixed \
              --no-progress --exit-code "$code" "$img" || rc=1
          fi
          echo "::endgroup::"
        done < /tmp/trivy-images.txt
        exit $rc
