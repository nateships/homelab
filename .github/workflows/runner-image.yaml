name: runner-image

on:
  push:
    branches: [main]
    paths:
      - runner/**
      - mise.toml
      - .github/workflows/runner-image.yaml

permissions:
  contents: read

# One build per ref; a newer push cancels an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and push runner image
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push image to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # BuildKit needed for the gha cache backend
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # repo root: the Dockerfile copies mise.toml
          context: .
          file: runner/Dockerfile
          push: true
          tags: |
            ghcr.io/nateships/spacelift-runner:latest
            ghcr.io/nateships/spacelift-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
