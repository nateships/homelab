name: runner-image

on:
  push:
    branches: [main]
    paths:
      - runner/**
      - mise.toml
      - .github/workflows/runner-image.yaml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # BuildKit needed for the gha cache backend
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # repo root: the Dockerfile copies mise.toml
          context: .
          file: runner/Dockerfile
          push: true
          tags: |
            ghcr.io/nateships/spacelift-runner:latest
            ghcr.io/nateships/spacelift-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
