name: runner-image

on:
  push:
    branches: [main]
    paths:
      - runner/**
      - .github/workflows/runner-image.yaml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: runner
          push: true
          tags: |
            ghcr.io/nateships/spacelift-runner:latest
            ghcr.io/nateships/spacelift-runner:${{ github.sha }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: runner
          file: runner/Dockerfile.ansible
          push: true
          tags: |
            ghcr.io/nateships/spacelift-runner-ansible:latest
            ghcr.io/nateships/spacelift-runner-ansible:${{ github.sha }}
