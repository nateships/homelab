# Weekly sweep of every app image, catching CVEs disclosed against
# images already deployed (which the PR gate, scanning only changed
# apps, cannot see). Each app uploads its findings under its own
# category (trivy-weekly/<app>), so the Security tab names the owning
# app natively. Report only: it surfaces, it does not block.
name: trivy-weekly

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: app list as matrix json
        id: list
        run: |
          apps=$(for d in kubernetes/apps/*/; do
            [ -f "$d/kustomization.yaml" ] && basename "$d"
          done | jq -R . | jq -sc .)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  scan:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to Code Scanning
    strategy:
      fail-fast: false # one app's failure must not cancel the rest
      matrix:
        app: ${{ fromJson(needs.setup.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: images for this app
        id: imgs
        env:
          APP: ${{ matrix.app }}
        run: |
          {
            echo "list<<EOF"
            kubectl kustomize --enable-helm "kubernetes/apps/$APP" 2>/dev/null \
              | grep -oE '^[[:space:]]+image:[[:space:]]*"?[^"[:space:]]+' \
              | sed -E 's/.*image:[[:space:]]*"?//' | sort -u
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: scan to SARIF (report only)
        if: steps.imgs.outputs.list != ''
        uses: $/.github/actions/trivy-scan
        with:
          images: ${{ steps.imgs.outputs.list }}
          severity: CRITICAL
          format: sarif
          soft-fail: "true"
      - name: fold this app's images into one run
        # An app with several images yields several SARIFs; Code Scanning
        # rejects multiple runs under one category, so concatenate them.
        if: steps.imgs.outputs.list != ''
        run: |
          jq -s '.[0].runs[0].results = [.[].runs[0].results[]]
            | .[0].runs[0].tool.driver.rules =
                ([.[].runs[0].tool.driver.rules[]] | unique_by(.id))
            | .[0]' sarif/*.sarif > trivy.sarif
      - name: upload to code scanning
        if: steps.imgs.outputs.list != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-weekly/${{ matrix.app }}
