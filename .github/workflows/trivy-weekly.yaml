# Weekly sweep of every app image, catching CVEs disclosed against
# images already deployed (which the PR gate, scanning only changed
# apps, cannot see). Report only: it never fails, it surfaces.
name: trivy-weekly

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: images from all apps
        id: imgs
        run: |
          {
            echo "list<<EOF"
            for app in kubernetes/apps/*/; do
              [ -f "$app/kustomization.yaml" ] || continue
              kubectl kustomize --enable-helm "$app" 2>/dev/null \
                | grep -oE '^[[:space:]]+image:[[:space:]]*"?[^"[:space:]]+' \
                | sed -E 's/.*image:[[:space:]]*"?//'
            done | sort -u
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: scan (report only)
        uses: ./.github/actions/trivy-scan
        with:
          images: ${{ steps.imgs.outputs.list }}
          soft-fail: "true"
