name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: fmt
        run: tofu fmt -check -recursive infra/
      - name: validate
        run: |
          for d in infra/spacelift infra/stacks/*/; do
            tofu -chdir="$d" init -backend=false
            tofu -chdir="$d" validate
          done

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: cilium bootstrap manifest is current
        run: |
          sh scripts/render-cilium-bootstrap.sh
          git diff --exit-code infra/stacks/cluster/manifests/
      - name: bootstrap kustomization renders
        run: kubectl kustomize kubernetes/bootstrap/argocd > /dev/null
      - name: kubeconform
        run: |
          # ApplicationSet/ClusterSecretStore are CRDs; skip unknown schemas.
          # apps/*/config.yaml files are ApplicationSet generator input, not
          # Kubernetes manifests; only the raw-manifest config dirs validate.
          kubeconform -strict -ignore-missing-schemas -summary \
            kubernetes/bootstrap/argocd/namespace.yaml \
            kubernetes/bootstrap/argocd/appset.yaml \
            kubernetes/apps/*/config/
