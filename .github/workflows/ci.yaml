name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # The same hooks as `prek install`, enforced so --no-verify cannot
      # skip them. trufflehog is skipped here: its hook scans the last
      # local commit; secret scanning stays the local hook plus branch
      # protection. Deep render/validate lives in the jobs below.
      - name: prek
        run: SKIP=trufflehog prek run --all-files --color always

  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: fmt
        run: tofu fmt -check -recursive infra/
      - name: validate
        run: |
          for d in infra/spacelift infra/stacks/*/; do
            tofu -chdir="$d" init -backend=false
            tofu -chdir="$d" validate
          done

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: appset config schema
        run: uv run --with pyyaml scripts/validate-app-configs.py
      - name: bootstrap kustomization renders
        run: kubectl kustomize kubernetes/bootstrap/argocd > /dev/null
      - name: apps render and validate
        run: |
          # Render each app exactly as ArgoCD does (kustomize with helm
          # inflation) and validate the final manifests. CRDs have no
          # upstream schemas; skip unknown kinds. pipefail makes a
          # kustomize failure fail the step (kubeconform accepts empty
          # input and exits 0).
          set -o pipefail
          for d in kubernetes/apps/*/; do
            echo "--- $d"
            kubectl kustomize --enable-helm "$d" \
              | kubeconform -strict -ignore-missing-schemas -summary
          done
      - name: kubeconform bootstrap manifests
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            kubernetes/bootstrap/argocd/namespace.yaml \
            kubernetes/bootstrap/argocd/appset.yaml
