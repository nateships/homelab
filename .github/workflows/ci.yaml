name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: fmt
        run: tofu fmt -check -recursive infra/
      - name: validate
        run: |
          for d in infra/spacelift infra/stacks/*/; do
            tofu -chdir="$d" init -backend=false
            tofu -chdir="$d" validate
          done

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: kubeconform
        run: |
          # Application/ClusterSecretStore are CRDs; skip unknown schemas
          kubeconform -strict -ignore-missing-schemas -summary \
            kubernetes/bootstrap/argocd/namespace.yaml \
            kubernetes/bootstrap/root.yaml \
            kubernetes/apps/
