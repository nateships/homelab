name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a PR's older in-flight run when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # Every prek hook, enforced so --no-verify cannot skip them.
      # trufflehog runs too: --all-files makes it a whole-tree scan.
      # Deep render/validate lives in the jobs below.
      - name: prek
        run: prek run --all-files --color always

  image-scan:
    name: image-scan
    # Gate image bumps (incl. renovate automerges) before they reach the
    # cluster: scan the images of the apps this PR changes, fail on a
    # fixable CRITICAL. Only on PRs; on main the merge already
    # happened. Scoped to changed apps so an untouched app's new CVE
    # never fails an unrelated PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the base ref to diff
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: images from changed apps
        id: imgs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          apps=$(git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep '^kubernetes/apps/' | cut -d/ -f1-3 | sort -u || true)
          {
            echo "list<<EOF"
            for app in $apps; do
              [ -f "$app/kustomization.yaml" ] || continue
              kubectl kustomize --enable-helm "$app" 2>/dev/null \
                | grep -oE '^[[:space:]]+image:[[:space:]]*"?[^"[:space:]]+' \
                | sed -E 's/.*image:[[:space:]]*"?//'
            done | sort -u
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: scan (fail on fixable CRITICAL)
        if: steps.imgs.outputs.list != ''
        uses: $/.github/actions/trivy-scan
        with:
          images: ${{ steps.imgs.outputs.list }}
          # CRITICAL only, matching the weekly sweep. The gate scans a
          # changed app's whole image and cannot tell a new HIGH from one
          # already in the base image, so a HIGH gate false-blocks bumps.
          severity: CRITICAL
          soft-fail: "false"

  opentofu:
    name: opentofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: fmt
        run: tofu fmt -check -recursive infra/
      - name: validate
        run: |
          for d in infra/spacelift infra/stacks/*/; do
            tofu -chdir="$d" init -backend=false
            tofu -chdir="$d" validate
          done

  kubernetes:
    name: kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: appset config schema
        run: uv run --with pyyaml scripts/validate-app-configs.py
      - name: bootstrap kustomization renders
        run: kubectl kustomize kubernetes/bootstrap/argocd > /dev/null
      - name: apps render and validate
        run: |
          # Render each app exactly as ArgoCD does (kustomize with helm
          # inflation) and validate the final manifests. CRDs have no
          # upstream schemas; skip unknown kinds. pipefail makes a
          # kustomize failure fail the step (kubeconform accepts empty
          # input and exits 0).
          set -o pipefail
          for d in kubernetes/apps/*/; do
            echo "--- $d"
            kubectl kustomize --enable-helm "$d" \
              | kubeconform -strict -ignore-missing-schemas -summary
          done
      - name: kubeconform bootstrap manifests
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            kubernetes/bootstrap/argocd/namespace.yaml \
            kubernetes/bootstrap/argocd/appset.yaml
