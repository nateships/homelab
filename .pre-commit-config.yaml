# Run with prek (pinned in mise.toml): `prek install` once, then automatic.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      # Catches duplicate mapping keys, which every YAML parser
      # downstream silently collapses (it once dropped the tailscale
      # namespace's privileged PSA label). Only tracked files reach the
      # hook, so gitignored charts/ need no exclusion.
      - id: yamllint
        name: yamllint
        entry: 'mise exec -- yamllint -d "{rules: {key-duplicates: enable}}"'
        language: system
        files: \.ya?ml$
      # Static analysis of GitHub Actions (injection, credential
      # persistence, unpinned actions). Offline: the high-value audits
      # are static and it needs no token.
      - id: zizmor
        name: zizmor
        entry: mise exec -- zizmor --offline
        language: system
        files: ^\.github/(workflows|actions)/.*\.ya?ml$
      # Public repo: block committed secrets before they ever reach GitHub.
      # Binary comes from mise.toml, like the other local hooks.
      - id: trufflehog
        name: trufflehog
        # Filesystem scan of the files being changed. On commit that is
        # the staged files; under `prek run --all-files` (CI) it is the
        # whole tracked tree. detect-private-key covers unverifiable keys.
        entry: mise exec -- trufflehog filesystem --no-update --log-level=-1 --results=verified --fail
        language: system
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt -recursive infra/
        language: system
        files: \.tf$
        pass_filenames: false
      # Raw manifests only; config.yaml, kustomization.yaml, and
      # values.yaml are inputs, not manifests. CI validates the full
      # rendered apps.
      - id: kubeconform
        name: kubeconform
        entry: >-
          sh -c 'find kubernetes/apps -name "*.yaml"
          ! -name config.yaml ! -name kustomization.yaml
          ! -name "values*.yaml" ! -path "*/charts/*" -print0
          | xargs -0 kubeconform -strict -ignore-missing-schemas
          kubernetes/bootstrap/argocd/namespace.yaml
          kubernetes/bootstrap/argocd/appset.yaml'
        language: system
        files: ^kubernetes/.*\.yaml$
        pass_filenames: false
