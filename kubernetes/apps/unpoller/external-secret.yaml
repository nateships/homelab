# Read-only local UniFi user from the "unifi" 1Password item. The
# url field carries the controller address, so no site value lands
# in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
  namespace: unpoller
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unpoller
  data:
    - secretKey: UP_UNIFI_DEFAULT_URL
      remoteRef:
        key: unifi
        property: url
    - secretKey: UP_UNIFI_DEFAULT_USER
      remoteRef:
        key: unifi
        property: username
    - secretKey: UP_UNIFI_DEFAULT_PASS
      remoteRef:
        key: unifi
        property: password
