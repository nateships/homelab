# Read-only local UniFi user from the "unifi" 1Password item. The
# url field carries the controller address, so no site value lands
# in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
  namespace: unpoller
spec:
  refreshInterval: 24h # items rotate only on tofu applies; Family-plan API quota is small
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unpoller
  data:
    - secretKey: UP_UNIFI_DEFAULT_URL
      remoteRef:
        # The url field sits in the item's config section.
        key: unifi/config/url
    - secretKey: UP_UNIFI_DEFAULT_USER
      remoteRef:
        key: unifi/username
    - secretKey: UP_UNIFI_DEFAULT_PASS
      remoteRef:
        key: unifi/password
