# ArgoCD manages itself: same kustomization the k8s-bootstrap stack applies
# once, so adoption is a no-op and upgrades flow through GitOps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  source:
    repoURL: https://github.com/nateships/homelab
    targetRevision: main
    path: kubernetes/bootstrap/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The ArgoCD CRDs overflow client-side apply annotations
      - ServerSideApply=true
