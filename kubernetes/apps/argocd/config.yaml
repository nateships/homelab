# ArgoCD manages itself: same kustomization the k8s-bootstrap stack
# applies once, so adoption is a no-op and upgrades flow through GitOps.
# Explicit sources (the only app with them): the bootstrap dir plus the
# ESO secret kustomization alongside this file.
name: argocd
namespace: argocd
sources:
  - path: kubernetes/bootstrap/argocd
  - path: kubernetes/apps/argocd
