# OIDC client for the ArgoCD UI, registered in tsidp (see docs/BOOTSTRAP.md).
# The part-of label lets argocd-server dereference $argocd-tsidp:<key>
# from its oidc.config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-tsidp
  namespace: argocd
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-tsidp
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  # onepasswordSDK key format: <item>/<field>; the store supplies the vault
  data:
    - secretKey: issuer
      remoteRef:
        key: tsidp-argocd/issuer
    - secretKey: clientID
      remoteRef:
        key: tsidp-argocd/username
    - secretKey: clientSecret
      remoteRef:
        key: tsidp-argocd/password
