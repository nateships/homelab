controllers:
  plex:
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/plex
          # renovate: datasource=docker depName=ghcr.io/home-operations/plex
          tag: 1.43.3.10896@sha256:4f1d88882a9883cc525e7c84b22c67c57416b7d3b35c3412329eeb07786433a7
        env:
          TZ: America/New_York
          # site-specific: the pinned service VIP (docs/SITE.md)
          PLEX_ADVERTISE_URL: http://10.16.101.225:32400
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            # iGPU SR-IOV virtual function (xe device plugin).
            gpu.intel.com/xe: 1
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    # video and render groups own the /dev/dri nodes.
    supplementalGroups: [44, 104]
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: plex
    type: LoadBalancer
    annotations:
      # site-specific: the pinned service VIP (docs/SITE.md)
      lbipam.cilium.io/ips: 10.16.101.225
    ports:
      http:
        port: 32400
persistence:
  config:
    accessMode: ReadWriteOnce
    size: 20Gi
  # Hardware transcode scratch; select /transcode in the server's
  # transcoder settings.
  transcode:
    type: emptyDir
  # readOnlyRootFilesystem needs a writable /tmp.
  tmp:
    type: emptyDir
  media:
    existingClaim: media
    globalMounts:
      # The library subtree only; paths match the previous server so
      # the copied database needs no path edits.
      - path: /data/media
        subPath: media
