apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Media library PV pair (one per consuming namespace; all point at
  # the same NFS export)
  - media-pv.yaml
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.1.0
    releaseName: nzbfast
    namespace: nzbfast
    valuesFile: values.yaml
