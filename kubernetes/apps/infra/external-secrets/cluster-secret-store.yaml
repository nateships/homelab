# 1Password via service-account token; no Connect server. The
# k8s-bootstrap stack creates the token secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  # Families plans allow 1000 read/write calls per day account-wide,
  # and an exhausted quota takes up to 24 hours to recover. Worst-case
  # retry burn across all ExternalSecrets must stay well under that.
  retrySettings:
    maxRetries: 2
    retryInterval: 2h
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
