controllers:
  pve-exporter:
    containers:
      app:
        image:
          repository: prompve/prometheus-pve-exporter
          # renovate: datasource=docker depName=prompve/prometheus-pve-exporter
          tag: 3.11.0@sha256:290756c34fd13e1d9972b8e64344d49a15ab99dd0053b29d9716f1ca4ae4c069
        env:
          # The host serves a self-signed certificate.
          PVE_VERIFY_SSL: "false"
        envFrom:
          - secretRef:
              name: pve-exporter
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: pve-exporter
    ports:
      http:
        port: 9221
persistence:
  # readOnlyRootFilesystem needs a writable /tmp: gunicorn keeps
  # worker heartbeat files there.
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
