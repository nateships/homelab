controllers:
  pve-exporter:
    containers:
      app:
        image:
          repository: prompve/prometheus-pve-exporter
          # renovate: datasource=docker depName=prompve/prometheus-pve-exporter
          tag: 3.10.1@sha256:5678b230735a80816755dc8b5e0fb139a6595e1d4271ace2d22ff82983d1bdf1
        env:
          # The host serves a self-signed certificate.
          PVE_VERIFY_SSL: "false"
        envFrom:
          - secretRef:
              name: pve-exporter
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: pve-exporter
    ports:
      http:
        port: 9221
persistence:
  # readOnlyRootFilesystem needs a writable /tmp: gunicorn keeps
  # worker heartbeat files there.
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
