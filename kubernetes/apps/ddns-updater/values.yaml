controllers:
  ddns-updater:
    containers:
      app:
        image:
          repository: docker.io/qmcgaw/ddns-updater
          # renovate: datasource=docker depName=docker.io/qmcgaw/ddns-updater
          tag: 2.10.0@sha256:3e2aa558946b5a293def4d73008fa4651c072b2c12932cecd02126fb23979831
        env:
          TZ: America/New_York
          PERIOD: 5m
          # CONFIG carries the full settings JSON; no config.json on
          # the data volume.
          CONFIG:
            valueFrom:
              secretKeyRef:
                name: ddns-updater
                key: config
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: ddns-updater
    ports:
      http:
        port: 8000
ingress:
  app:
    className: tailscale
    annotations:
      # Served as a Tailscale Service by the shared ProxyGroup.
      tailscale.com/proxy-group: ingress
      # Advertise before the cert exists: HTTPS-only services deadlock
      # on first deploy (no advertise without cert, no cert without
      # advertise). The tailnet transport is encrypted regardless.
      tailscale.com/http-endpoint: enabled
    # The tailscale controller ignores host-bearing rules; the tailnet
    # name comes from tls.hosts and the backend is the default.
    defaultBackend:
      service:
        name: ddns-updater
        port:
          number: 8000
    tls:
      - hosts: [ddns]
persistence:
  # Update history.
  data:
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /updater/data
