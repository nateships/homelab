# The whole ddns config (records, zone ids, token) is one JSON blob
# in the "ddns-updater" 1Password item: site data stays out of git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ddns-updater
  namespace: ddns-updater
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ddns-updater
  data:
    - secretKey: config
      remoteRef:
        key: ddns-updater/config
