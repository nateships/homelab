controllers:
  profilarr:
    containers:
      app:
        image:
          repository: ghcr.io/dictionarry-hub/profilarr
          # renovate: datasource=docker depName=ghcr.io/dictionarry-hub/profilarr
          tag: 2.3.1@sha256:352e42dec74ecfd68d13bb198fbc6d9346e3a8c55003026e1814e59319a2176d
        env:
          TZ: America/New_York
          # Auth is the tailnet ingress.
          AUTH: "off"
          # The profile database is a git checkout under /config; git
          # needs a writable HOME.
          HOME: /config
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  annotations:
    # Scratch (and shared-library) volumes stay out of velero's file
    # backups.
    backup.velero.io/backup-volumes-excludes: tmp
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: profilarr
    ports:
      http:
        port: 6868
ingress:
  app:
    className: tailscale
    annotations:
      # Served as a Tailscale Service by the shared ProxyGroup.
      tailscale.com/proxy-group: ingress
      # Advertise before the cert exists: HTTPS-only services deadlock
      # on first deploy (no advertise without cert, no cert without
      # advertise). The tailnet transport is encrypted regardless.
      tailscale.com/http-endpoint: enabled
    # The tailscale controller ignores host-bearing rules; the tailnet
    # name comes from tls.hosts and the backend is the default.
    defaultBackend:
      service:
        name: profilarr
        port:
          number: 6868
    tls:
      - hosts: [profilarr]
persistence:
  config:
    accessMode: ReadWriteOnce
    size: 2Gi
  # readOnlyRootFilesystem needs a writable /tmp.
  tmp:
    type: emptyDir
