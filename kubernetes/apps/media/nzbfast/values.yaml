controllers:
  nzbfast:
    containers:
      app:
        image:
          repository: ghcr.io/nzbfast/nzbfast
          # renovate: datasource=docker depName=ghcr.io/nzbfast/nzbfast
          tag: 1.3.1@sha256:7a0cd161a19bd025871342d4ae6e2323fde87e664e2d845bff9bb10fbb6d3da7
        env:
          TZ: America/New_York
          # nzbfast writes at the final path from the first article on;
          # there is no separate incomplete dir to configure. This keeps
          # finished (and in-flight) jobs where NZBGet's DestDir was, so
          # the *arrs import from the same tree.
          NZBFAST_OUT: /data/usenet/complete
          # Auth is delegated to the tailnet ingress: run keyless. The
          # entrypoint's API-key preflight and the daemon both skip auth.
          NZBFAST_OPEN: "1"
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  annotations:
    # Library and scratch volumes stay out of velero's file backups.
    backup.velero.io/backup-volumes-excludes: media,tmp,watch
  # Media-stack identity: files on the media export are UID 1024 / GID 100.
  # Non-root also skips the image entrypoint's PUID/gosu path: the daemon
  # is exec'd directly as this user.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: nzbfast
    ports:
      http:
        port: 6789
ingress:
  app:
    className: tailscale
    annotations:
      # Served as a Tailscale Service by the shared ProxyGroup.
      tailscale.com/proxy-group: ingress
      # Advertise before the cert exists: HTTPS-only services deadlock
      # on first deploy (no advertise without cert, no cert without
      # advertise). The tailnet transport is encrypted regardless.
      tailscale.com/http-endpoint: enabled
    # The tailscale controller ignores host-bearing rules; the tailnet
    # name comes from tls.hosts and the backend is the default.
    defaultBackend:
      service:
        name: nzbfast
        port:
          number: 6789
    tls:
      - hosts: [nzbfast]
persistence:
  # /config is the install: settings.json, the queue journal and index.db
  # (WORKDIR is /config, so relative state lands here too).
  config:
    accessMode: ReadWriteOnce
    size: 2Gi
  # readOnlyRootFilesystem needs a writable /tmp.
  tmp:
    type: emptyDir
  # The image's default watch folder (NZBFAST_WATCH=/watch) sits on the
  # read-only root filesystem; an emptyDir keeps it writable. Unused in
  # practice - the *arrs hand over NZBs via the API.
  watch:
    type: emptyDir
  media:
    existingClaim: media
    globalMounts:
      - path: /data/usenet
        subPath: usenet
