controllers:
  plex:
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/plex
          # renovate: datasource=docker depName=ghcr.io/home-operations/plex
          tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
        env:
          TZ: America/New_York
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            # iGPU SR-IOV virtual function (xe device plugin).
            gpu.intel.com/xe: 1
defaultPodOptions:
  annotations:
    # Library and scratch volumes stay out of velero's file backups.
    backup.velero.io/backup-volumes-excludes: media,transcode,downloads,tmp
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    # video and render groups own the /dev/dri nodes.
    supplementalGroups: [44, 104]
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: plex
    type: LoadBalancer
    annotations:
      # site-specific: the pinned service VIP (docs/SITE.md)
      lbipam.cilium.io/ips: 10.16.101.225
    ports:
      http:
        port: 32400
persistence:
  config:
    accessMode: ReadWriteOnce
    size: 20Gi
  # Hardware transcode scratch; select /transcode in the server's
  # transcoder settings.
  transcode:
    type: emptyDir
  # Staged offline downloads must survive pod restarts until clients
  # fetch them; select /downloads in the transcoder settings.
  downloads:
    accessMode: ReadWriteOnce
    size: 25Gi
  # readOnlyRootFilesystem needs a writable /tmp.
  tmp:
    type: emptyDir
  media:
    existingClaim: media
    globalMounts:
      # The library subtree only; paths match the previous server so
      # the copied database needs no path edits.
      - path: /data/media
        subPath: media
