# Dedicated PVEAuditor token from the pve-exporter 1Password item;
# the item's notes carry the pveum commands that mint it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter
  namespace: pve-exporter
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pve-exporter
  data:
    - secretKey: PVE_USER
      remoteRef:
        key: pve-exporter/username
    - secretKey: PVE_TOKEN_NAME
      remoteRef:
        key: pve-exporter/config/token-name
    - secretKey: PVE_TOKEN_VALUE
      remoteRef:
        key: pve-exporter/password
