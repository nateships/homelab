controllers:
  nzbget:
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/nzbget
          # renovate: datasource=docker depName=ghcr.io/home-operations/nzbget
          tag: 26.3.0@sha256:7b8c77ede65ad37b55e318a38e09249e196736c319bd3c24034f7d53a2f1ba5a
        env:
          TZ: America/New_York
        # -o overrides beat the config file, so a settings restore
        # cannot change these. ${AppDir} is expanded by nzbget.
        args:
          - -o
          - MainDir=/config
          - -o
          - DestDir=/data/usenet/complete
          - -o
          - InterDir=/data/usenet/incomplete
          - -o
          - WebDir=${AppDir}/webui
          - -o
          - ConfigTemplate=${AppDir}/webui/nzbget.conf.template
          - -o
          - CertStore=${AppDir}/cacert.pem
          - -o
          - ScriptDir=/config/scripts
          - -o
          - TempDir=/tmp
          - -o
          - LockFile=/config/nzbget.lock
          - -o
          - WriteLog=none
          - -o
          - UpdateCheck=none
          # Auth is delegated to the tailnet ingress.
          - -o
          - ControlUsername=
          - -o
          - ControlPassword=
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  # Media-stack identity: files on the NAS are UID 1024 / GID 100.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: nzbget
    ports:
      http:
        port: 6789
ingress:
  app:
    className: tailscale
    annotations:
      # Served as a Tailscale Service by the shared ProxyGroup.
      tailscale.com/proxy-group: ingress
      # Advertise before the cert exists: HTTPS-only services deadlock
      # on first deploy (no advertise without cert, no cert without
      # advertise). The tailnet transport is encrypted regardless.
      tailscale.com/http-endpoint: enabled
    # The tailscale controller ignores host-bearing rules; the tailnet
    # name comes from tls.hosts and the backend is the default.
    defaultBackend:
      service:
        name: nzbget
        port:
          number: 6789
    tls:
      - hosts: [nzbget]
persistence:
  config:
    accessMode: ReadWriteOnce
    size: 2Gi
  # readOnlyRootFilesystem needs a writable /tmp.
  tmp:
    type: emptyDir
  media:
    existingClaim: media
    globalMounts:
      # Same path the download tree uses on the NAS.
      - path: /data/usenet
        subPath: usenet
