# Every container image must be pinned to a digest or a non-latest
# tag. Renovate keeps the pins current; this stops an unpinned image
# from slipping in. System namespaces are exempt (Talos and ad-hoc
# debug pods set their own images).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-latest-image
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@') ||
          (c.image.contains(':') && !c.image.endsWith(':latest')))
      message: "container images must be pinned to a digest or a non-latest tag"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: disallow-latest-image
spec:
  policyName: disallow-latest-image
  # Warn + Audit first (non-breaking). Switch to ["Deny"] once the
  # audit stream confirms zero violations.
  validationActions: ["Warn", "Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-node-lease", "kube-public"]
