# Credentials for the controller. The API token comes from the
# cloudflare-tunnel item; the account id is reused from cloudflare-r2.
# tunnel_name is a literal: the controller creates the tunnel if it
# does not exist. Key names match the chart's cloudflare.secretRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare-tunnel
spec:
  refreshInterval: 24h # items rotate only on tofu applies; Family-plan API quota is small
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-tunnel
    template:
      data:
        api_token: "{{ .apiToken }}"
        account_id: "{{ .accountId }}"
        tunnel_name: homelab-k8s-ingress
  data:
    - secretKey: apiToken
      remoteRef:
        key: cloudflare-tunnel/password
    - secretKey: accountId
      remoteRef:
        key: cloudflare-r2/account-id
