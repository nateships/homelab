# API key from the "sonarr" 1Password item; the pod pins it via
# SONARR__AUTH__APIKEY and consuming apps read the same item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
  namespace: sonarr
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sonarr
  data:
    - secretKey: api_key
      remoteRef:
        key: sonarr/password
