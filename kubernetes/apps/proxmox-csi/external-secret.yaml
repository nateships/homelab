# Renders the plugin config with the CSI API token (proxmox-csi item)
# and the PVE URL (proxmox item, lan-url field). region matches the
# topology.kubernetes.io/region label on the workers (cluster stack).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-csi-plugin
  namespace: csi-proxmox
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: proxmox-csi-plugin
    template:
      data:
        config.yaml: |
          clusters:
            # lan-url carries the full API URL (.../api2/json).
            - url: "{{ .lan_url }}"
              insecure: true
              token_id: "kubernetes-csi@pve!csi"
              token_secret: "{{ .token }}"
              region: homelab
  data:
    - secretKey: token
      remoteRef:
        key: proxmox-csi/password
    - secretKey: lan_url
      remoteRef:
        key: proxmox/lan-url
