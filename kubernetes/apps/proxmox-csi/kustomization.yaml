apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Plugin config with the API token (ESO)
  - external-secret.yaml
helmCharts:
  - name: proxmox-csi-plugin
    repo: oci://ghcr.io/sergelogvinov/charts
    version: 0.5.12
    releaseName: proxmox-csi
    namespace: csi-proxmox
    includeCRDs: true
    valuesInline:
      existingConfigSecret: proxmox-csi-plugin
      # The default (5) makes the sidecars dump every gRPC exchange;
      # Loki misreads the err=null lines as errors.
      logVerbosityLevel: 2
      storageClass:
        - name: proxmox-zfs
          storage: zpool
          reclaimPolicy: Delete
          fstype: xfs
          ssd: "true"
patches:
  # The chart has no default-class flag.
  - patch: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: proxmox-zfs
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
