# S3 credentials from the "velero" 1Password item (minted by the
# cloudflare stack), rendered as velero's aws credentials file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-r2
  namespace: velero
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: velero-r2
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key_id }}
          aws_secret_access_key={{ .secret_access_key }}
  data:
    - secretKey: access_key_id
      remoteRef:
        key: velero/username
    - secretKey: secret_access_key
      remoteRef:
        key: velero/password
