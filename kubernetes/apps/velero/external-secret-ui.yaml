# OIDC client for velero-ui, registered in tsidp (the tsidp-velero-ui
# item; username = client id, password = secret, issuer = tsidp URL).
# The template derives every endpoint from the issuer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-ui-oidc
  namespace: velero
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: velero-ui-oidc
    template:
      data:
        OAUTH_AUTH_ENABLED: "true"
        OAUTH_NAME: Tailscale
        OAUTH_CLIENT_ID: "{{ .clientID }}"
        OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
        OAUTH_AUTHORIZATION_URL: "{{ .issuer }}/authorize"
        OAUTH_TOKEN_URL: "{{ .issuer }}/token"
        OAUTH_USER_INFO_URL: "{{ .issuer }}/userinfo"
        OAUTH_REDIRECT_URI: '{{ .issuer | replace "tsidp." "velero." }}/api/auth/oauth'
  data:
    - secretKey: clientID
      remoteRef:
        key: tsidp-velero-ui/username
    - secretKey: clientSecret
      remoteRef:
        key: tsidp-velero-ui/password
    - secretKey: issuer
      remoteRef:
        key: tsidp-velero-ui/issuer
