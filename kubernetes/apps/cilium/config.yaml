# ArgoCD adopts the Cilium that the one-time Omni bootstrap manifest
# installed. The values live once, in values.yaml, shared with
# scripts/render-cilium-bootstrap.sh.
name: cilium
namespace: kube-system
sources:
  - repoURL: https://helm.cilium.io
    chart: cilium
    # renovate: datasource=helm registryUrl=https://helm.cilium.io depName=cilium
    targetRevision: 1.18.1
    helm:
      valueFiles:
        - $values/kubernetes/apps/cilium/values.yaml
  - repoURL: https://github.com/nateships/homelab
    targetRevision: main
    ref: values
