# values.yaml is shared with the bootstrap render in
# infra/stacks/cluster/main.tf. Keep this version equal to that pin
# (Renovate groups the two).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Cilium implements Gateway API but does not ship the CRDs.
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
  # VIP pool and L2 announcement policy
  - lb-ipam.yaml
  - hubble-ingress.yaml
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.20.1
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml
    includeCRDs: true
