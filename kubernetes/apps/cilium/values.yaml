# Two consumers: the bootstrap render (infra/stacks/cluster) and the
# cilium kustomization.
ipam:
  mode: kubernetes
kubeProxyReplacement: true
# cronJob cert method: certs generate in-cluster, so the rendered
# chart stays free of Secrets (the bootstrap render enforces that).
hubble:
  enabled: true
  tls:
    auto:
      enabled: true
      method: cronJob
  relay:
    enabled: true
  ui:
    enabled: true
    service:
      # Omni workload proxy: https://hubble.<omni domain>
      annotations:
        omni-kube-service-exposer.sidero.dev/port: "50081:80"
        omni-kube-service-exposer.sidero.dev/label: Hubble
        omni-kube-service-exposer.sidero.dev/prefix: hubble
# Talos-specific settings
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
