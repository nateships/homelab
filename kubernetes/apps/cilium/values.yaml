# Two consumers: the bootstrap render (infra/stacks/cluster) and the
# cilium kustomization.
ipam:
  mode: kubernetes
kubeProxyReplacement: true
# DSR keeps the original client IP on LoadBalancer traffic: the
# announcing node forwards to the backend node in a geneve header and
# replies leave the backend node directly. DSR dispatch cannot ride
# vxlan, hence the geneve tunnel.
tunnelProtocol: geneve
loadBalancer:
  mode: dsr
  dsrDispatch: geneve
# Auto-detection picks the lowest host link MTU, which is the 1280
# siderolink management tunnel; pods then drop larger UDP (QUIC
# handshakes time out; cilium/cilium#37529). Pin to the datapath NIC.
MTU: 1500
# cronJob cert method: certs generate in-cluster, so the rendered
# chart stays free of Secrets (the bootstrap render enforces that).
hubble:
  enabled: true
  tls:
    auto:
      enabled: true
      method: cronJob
  relay:
    enabled: true
  ui:
    enabled: true
# Service VIPs on the node VLAN (pool + L2 policy in lb-ipam.yaml)
l2announcements:
  enabled: true
# L2 announcements renew leases constantly; the default client rate
# limit starves them.
k8sClientRateLimit:
  qps: 50
  burst: 100
# Talos-specific settings
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# No TLS-aware CiliumNetworkPolicies: skip the secret-sync RBAC and
# the cilium-secrets namespace it lives in.
tls:
  readSecretsOnlyFromSecretsNamespace: false
  secretSync:
    enabled: false
  secretsNamespace:
    create: false
