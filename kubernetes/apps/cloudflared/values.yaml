controllers:
  cloudflared:
    replicas: 2
    containers:
      app:
        image:
          repository: docker.io/cloudflare/cloudflared
          # renovate: datasource=docker depName=docker.io/cloudflare/cloudflared
          tag: 2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
        args:
          - tunnel
          - --no-autoupdate
          # The k8s VLAN blocks outbound UDP 7844; QUIC cannot
          # complete and the probes recycle the pod.
          - --protocol
          - http2
          - --metrics
          - 0.0.0.0:2000
          - run
        env:
          TZ: America/New_York
          TUNNEL_TOKEN:
            valueFrom:
              secretKeyRef:
                name: cloudflared
                key: tunnel_token
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: 2000
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: 2000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
