# Tunnel token from the "cloudflared" 1Password item; the cloudflare
# stack mints it with the tunnel.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  refreshInterval: 24h # items rotate only on tofu applies; Family-plan API quota is small
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflared
  data:
    - secretKey: tunnel_token
      remoteRef:
        key: cloudflared/password
