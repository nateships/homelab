# Datadog API key from the "datadog" 1Password item. The DatadogAgent
# CR references this exact secret name and key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-secret
  namespace: datadog
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: datadog-secret
  data:
    - secretKey: api-key
      remoteRef:
        key: datadog/api-key
