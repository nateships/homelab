# The operator turns this into the node-agent DaemonSet and the cluster
# agent. Defaults cover infra metrics and the orchestrator explorer.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: homelab
    site: datadoghq.com
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    kubelet:
      # Talos kubelets serve self-signed certs the agent cannot verify.
      tlsVerify: false
  features:
    logCollection:
      enabled: true
      containerCollectAll: true
