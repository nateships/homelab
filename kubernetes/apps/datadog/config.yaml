# Datadog agents via the plain chart (no operator, no CRDs): node
# agents, cluster agent, infra metrics, orchestrator explorer, and log
# collection. The API key Secret rides alongside (config/, ESO).
name: datadog
namespace: datadog
# Node agents mount host paths (containerd socket, /proc, cgroups) and
# use hostPID; Talos enforces baseline PSA, so the namespace opts up.
namespaceLabels:
  pod-security.kubernetes.io/enforce: privileged
sources:
  - repoURL: https://helm.datadoghq.com
    chart: datadog
    # renovate: datasource=helm registryUrl=https://helm.datadoghq.com depName=datadog
    targetRevision: 3.240.0
    helm:
      valuesObject:
        datadog:
          site: datadoghq.com
          clusterName: homelab
          apiKeyExistingSecret: datadog-secret
          kubelet:
            # Talos kubelets serve self-signed certs the agent
            # cannot verify.
            tlsVerify: false
          logs:
            enabled: true
            containerCollectAll: true
  # API-key secret (ESO)
  - repoURL: https://github.com/nateships/homelab
    targetRevision: main
    path: kubernetes/apps/datadog/config
