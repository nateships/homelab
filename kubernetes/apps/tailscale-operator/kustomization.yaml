# The chart's oauth block stays empty, so the operator mounts the
# pre-created operator-oauth secret that ESO delivers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secret.yaml
helmCharts:
  - name: tailscale-operator
    repo: https://pkgs.tailscale.com/helmcharts
    version: 1.102.3
    releaseName: tailscale-operator
    namespace: tailscale
    includeCRDs: true
