# The chart's oauth block stays empty; the operator mounts the
# operator-oauth secret from ESO.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secret.yaml
  - proxygroup.yaml
helmCharts:
  - name: tailscale-operator
    repo: https://pkgs.tailscale.com/helmcharts
    version: 1.102.3
    releaseName: tailscale-operator
    namespace: tailscale
    includeCRDs: true
