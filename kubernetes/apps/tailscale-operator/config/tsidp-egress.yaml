# Egress proxy: in-cluster clients (ArgoCD OIDC) reach tsidp through this
# Service. The tailnet IP annotation avoids committing the tailnet name;
# a CoreDNS rewrite (k8s-bootstrap stack) maps the tsidp FQDN here so the
# OIDC issuer URL resolves in-cluster.
apiVersion: v1
kind: Service
metadata:
  name: tsidp
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-ip: 100.84.16.7
spec:
  type: ExternalName
  externalName: placeholder # the operator overwrites this
