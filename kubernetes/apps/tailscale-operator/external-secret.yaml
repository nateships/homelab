# Operator OAuth client (scopes Auth Keys write + Devices Core write,
# tag tag:k8s-operator). The chart mounts this exact secret name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-operator/username
    - secretKey: client_secret
      remoteRef:
        key: tailscale-operator/password
