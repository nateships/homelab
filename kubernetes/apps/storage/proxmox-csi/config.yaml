# Block storage for app configs (SQLite-safe): the plugin provisions
# VM disks on the PVE zpool through the Proxmox API and hot-attaches
# them to workers. Volumes are Proxmox storage objects and survive
# worker replacement; drain a worker before destroying it so volumes
# detach first.
name: proxmox-csi
namespace: csi-proxmox
# The node plugin mounts host paths and runs privileged; Talos
# enforces baseline PSA, so the namespace opts up.
namespaceLabels:
  pod-security.kubernetes.io/enforce: privileged
