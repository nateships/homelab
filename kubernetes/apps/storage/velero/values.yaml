image:
  repository: velero/velero
  # renovate: datasource=docker depName=velero/velero
  tag: v1.18.3@sha256:b839e52bc2c69eb3b5a84b010b8b3c7f714f3c5ef50b77ec7770a382a8f2e0ab
initContainers:
  - name: velero-plugin-for-aws
    # main build: every release through v1.14.2 sends an empty
    # x-amz-tagging header that R2 rejects (fixed on main 2026-05-21,
    # unreleased). Swap back to a release pin once one contains it.
    image: velero/velero-plugin-for-aws:main@sha256:ac64d9af289a3b7a74c9f912dadb0fac5d0b4aae2f484fb5d1a197e7ab3897ae
    volumeMounts:
      - mountPath: /target
        name: plugins
credentials:
  useSecret: true
  existingSecret: velero-r2
configuration:
  # One finished kopia-maintenance job kept per repo (default is
  # three): every kept job is a completed pod kube-state-metrics
  # keeps exporting.
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1
  # Kopia file-system backup; no CSI snapshots.
  defaultVolumesToFsBackup: true
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-backups
      config:
        region: auto
        s3ForcePathStyle: "true"
        # site-specific: R2 endpoint carries the account id (docs/SITE.md)
        s3Url: https://6583c8e51ebe94090949e37a7c403844.r2.cloudflarestorage.com
        # R2 rejects the SDK's streaming checksums.
        checksumAlgorithm: ""
        # R2 also rejects the (empty) object-tagging header.
        tagging: ""
  volumeSnapshotLocation: []
snapshotsEnabled: false
deployNodeAgent: true
schedules:
  daily-config:
    disabled: false
    schedule: "0 4 * * *"
    template:
      # Three days of daily config snapshots. Kopia dedups the base,
      # so TTL mostly bounds how many days of churn the repo carries.
      ttl: 72h
      includedNamespaces:
        - "*"
      # kube-system is fully declarative (git and the Omni bootstrap
      # manifests); its daemonset pods also run on control planes,
      # where no node-agent exists for the default fs-backup.
      excludedNamespaces:
        - kube-system
# Scraped via the monitoring chart's annotation autodiscovery; the
# backup-failure alerts feed on these. The annotations do the actual
# opt-in: without them the alerts evaluate against nothing.
metrics:
  enabled: true
  podAnnotations:
    k8s.grafana.com/scrape: "true"
    k8s.grafana.com/metrics.portNumber: "8085"
    k8s.grafana.com/job: integrations/velero
upgradeCRDs: true
