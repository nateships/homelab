apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # R2 credentials file (ESO)
  - external-secret.yaml
  # OIDC client env for velero-ui (ESO)
  - external-secret-ui.yaml
  # The chart's ingress is host-based; tailscale needs host-less.
  - ui-ingress.yaml
helmCharts:
  - name: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    version: 12.1.0
    releaseName: velero
    namespace: velero
    includeCRDs: true
    valuesFile: values.yaml
  - name: velero-ui
    repo: https://helm.otwld.com
    version: 0.15.0
    releaseName: velero-ui
    namespace: velero
    valuesFile: values-ui.yaml
