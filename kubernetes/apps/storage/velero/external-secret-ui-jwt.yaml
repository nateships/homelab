# JWT signing key for velero-ui. ESO generates it in the cluster.
# It does not touch 1Password. A new key only logs users out.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: velero-ui-jwt
  namespace: velero
spec:
  length: 64
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-ui-jwt
  namespace: velero
spec:
  refreshInterval: "0" # generate once; a refresh makes a new key
  target:
    name: velero-ui-jwt
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: velero-ui-jwt
