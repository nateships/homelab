image:
  repository: otwld/velero-ui
  # renovate: datasource=docker depName=otwld/velero-ui
  tag: 0.12.0@sha256:9363d73cde32c60ef080b68a3e37f41ec307701dd007545a8fd9127b3382d40e
# Login is tailscale identity through tsidp; the OAUTH_* envs come
# from the velero-ui-oidc secret.
envFrom:
  - secretRef:
      name: velero-ui-oidc
# SSO only. The app refuses to start with default local credentials.
env:
  - name: BASIC_AUTH_ENABLED
    value: "false"
configuration:
  general:
    secretPassPhrase:
      existingSecret: velero-ui-jwt
      key: password # the ESO Password generator output key
  # SSO users get no permissions without a rule. tsidp signs in only
  # tailnet users, so every signed-in user gets full access.
  policies:
    enabled: true
    value: |
      u,*,manage,all
