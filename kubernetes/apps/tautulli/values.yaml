controllers:
  tautulli:
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/tautulli
          # renovate: datasource=docker depName=ghcr.io/home-operations/tautulli
          tag: 2.18.1@sha256:2cc92abed174f89d4fa75ab98e39af0114f37829e9c675718b264cc80931c4f5
        env:
          TZ: America/New_York
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: tautulli
    ports:
      http:
        port: 8181
ingress:
  app:
    className: tailscale
    annotations:
      # Served as a Tailscale Service by the shared ProxyGroup.
      tailscale.com/proxy-group: ingress
      # Advertise before the cert exists: HTTPS-only services deadlock
      # on first deploy (no advertise without cert, no cert without
      # advertise). The tailnet transport is encrypted regardless.
      tailscale.com/http-endpoint: enabled
    # The tailscale controller ignores host-bearing rules; the tailnet
    # name comes from tls.hosts and the backend is the default.
    defaultBackend:
      service:
        name: tautulli
        port:
          number: 8181
    tls:
      - hosts: [tautulli]
persistence:
  config:
    accessMode: ReadWriteOnce
    size: 5Gi
  # readOnlyRootFilesystem needs a writable /tmp.
  tmp:
    type: emptyDir
