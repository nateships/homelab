controllers:
  unpoller:
    containers:
      app:
        image:
          repository: ghcr.io/unpoller/unpoller
          # renovate: datasource=docker depName=ghcr.io/unpoller/unpoller
          tag: v5.2.2@sha256:368126bce83af861109e1889d19786071cbf43fc39ef42026910b9717c20a107
        env:
          TZ: America/New_York
          # Prometheus is the only output.
          UP_INFLUXDB_DISABLE: "true"
          # The controller serves a self-signed certificate.
          UP_UNIFI_DEFAULT_VERIFY_SSL: "false"
        envFrom:
          - secretRef:
              name: unpoller
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  annotations:
    k8s.grafana.com/scrape: "true"
    k8s.grafana.com/metrics.portNumber: "9130"
    k8s.grafana.com/job: integrations/unpoller
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: unpoller
    ports:
      http:
        port: 9130
