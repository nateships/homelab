controllers:
  prowlarr:
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/prowlarr
          # renovate: datasource=docker depName=ghcr.io/home-operations/prowlarr
          tag: 2.6.2@sha256:13c576d2ad93764ab78d4e75c80447bc5489a06a15fd39e89c0be0be01e2ba3a
        env:
          TZ: America/New_York
          # Auth is the tailnet ingress; the UI trusts it (the API
          # stays key-protected).
          PROWLARR__AUTH__METHOD: External
          PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
          # Pinned config-plane settings; env beats the restored
          # config.xml. URLBASE stays empty behind the tailnet
          # ingress; the port matches the service and probes.
          PROWLARR__SERVER__PORT: "9696"
          PROWLARR__SERVER__URLBASE: ""
          PROWLARR__LOG__ANALYTICSENABLED: "False"
          PROWLARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: prowlarr
                key: api_key
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  annotations:
    # Scratch (and shared-library) volumes stay out of velero's file
    # backups.
    backup.velero.io/backup-volumes-excludes: tmp
  # Media-stack identity: files on the media export are UID 1024 / GID 100.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: prowlarr
    ports:
      http:
        port: 9696
ingress:
  app:
    className: tailscale
    annotations:
      # Served as a Tailscale Service by the shared ProxyGroup.
      tailscale.com/proxy-group: ingress
      # Advertise before the cert exists: HTTPS-only services deadlock
      # on first deploy (no advertise without cert, no cert without
      # advertise). The tailnet transport is encrypted regardless.
      tailscale.com/http-endpoint: enabled
    # The tailscale controller ignores host-bearing rules; the tailnet
    # name comes from tls.hosts and the backend is the default.
    defaultBackend:
      service:
        name: prowlarr
        port:
          number: 9696
    tls:
      - hosts: [prowlarr]
persistence:
  config:
    accessMode: ReadWriteOnce
    size: 2Gi
  # readOnlyRootFilesystem needs a writable /tmp.
  tmp:
    type: emptyDir
