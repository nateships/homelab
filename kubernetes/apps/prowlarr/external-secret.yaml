# API key from the "prowlarr" 1Password item; the pod pins it via
# PROWLARR__AUTH__APIKEY and the arr apps read the same item for
# their prowlarr connections.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prowlarr
  data:
    - secretKey: api_key
      remoteRef:
        key: prowlarr/password
