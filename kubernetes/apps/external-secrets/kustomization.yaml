apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ClusterSecretStore pointing at 1Password
  - cluster-secret-store.yaml
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.10.0
    releaseName: external-secrets
    namespace: external-secrets
    includeCRDs: true
    valuesInline:
      installCRDs: true
      # Controller metrics (sync errors, provider latency) via the
      # monitoring chart's annotation autodiscovery.
      podAnnotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "8080"
        k8s.grafana.com/job: integrations/external-secrets
