# 1Password via service account token; no Connect server.
# The k8s-bootstrap stack creates the bootstrap secret from its run
# environment (infra/stacks/k8s-bootstrap/site.yml). It is never committed.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
