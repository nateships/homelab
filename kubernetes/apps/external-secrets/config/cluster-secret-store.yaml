# 1Password via service account token; no Connect server.
# Bootstrap secret (created once, by hand, never committed):
#   kubectl -n external-secrets create secret generic onepassword-service-account \
#     --from-literal=token='ops_...'
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
