# 1Password via service-account token; no Connect server. The
# k8s-bootstrap stack creates the token secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  # Once the Family-plan API quota is exhausted, every retry counts
  # against it and keeps it exhausted; long spacing lets the window
  # recover.
  retrySettings:
    maxRetries: 2
    retryInterval: 30m
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
