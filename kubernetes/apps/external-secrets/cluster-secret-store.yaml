# 1Password via service-account token; no Connect server. The
# k8s-bootstrap stack creates the token secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  # The daily quota is the binding limit; once it is exhausted,
  # account-wide). Retries from 14 stores must stay well under that. is a 24-hour wait (Families: 1000 read/write per day,
  # account-wide). Retries from 14 stores must stay well under that.
  retrySettings:
    maxRetries: 2
    retryInterval: 2h
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
