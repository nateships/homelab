name: external-secrets
namespace: external-secrets
sources:
  # Operator (Helm)
  - repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # renovate: datasource=helm registryUrl=https://charts.external-secrets.io depName=external-secrets
    targetRevision: 2.9.0
    helm:
      valuesObject:
        installCRDs: true
  # ClusterSecretStore pointing at 1Password (git dir alongside this file)
  - path: kubernetes/apps/external-secrets/config
