# Secrets and the site-specific public URL from the marreta 1Password
# item; the app-url field keeps the tailnet name out of git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marreta
  namespace: marreta
spec:
  refreshInterval: 24h # items rotate only on tofu applies; Family-plan API quota is small
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: marreta
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: marreta/app-key
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: marreta/admin-password
    - secretKey: APP_URL
      remoteRef:
        key: marreta/app-url
