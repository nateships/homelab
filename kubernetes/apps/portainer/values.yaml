controllers:
  portainer:
    containers:
      app:
        image:
          repository: portainer/portainer-ce
          # renovate: datasource=docker depName=portainer/portainer-ce
          tag: 2.45.0@sha256:511f3f06c96fe3b993ebeaafde311c1959cae73a7ef825dba6397d51b450dffa
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  securityContext:
    # The image entrypoint runs as its own unprivileged user; the
    # data volume just has to be writable by it.
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: portainer
    ports:
      http:
        port: 9000
ingress:
  app:
    className: tailscale
    annotations:
      # Served as a Tailscale Service by the shared ProxyGroup.
      tailscale.com/proxy-group: ingress
      # Advertise before the cert exists: HTTPS-only services deadlock
      # on first deploy (no advertise without cert, no cert without
      # advertise). The tailnet transport is encrypted regardless.
      tailscale.com/http-endpoint: enabled
    defaultBackend:
      service:
        name: portainer
        port:
          number: 9000
    tls:
      - hosts: [portainer]
persistence:
  data:
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /data
