# Grafana Cloud stack details from the "grafana-cloud" 1Password
# item: instance ids, hosts, and one access-policy token. The chart
# reads hosts from the secret too (urlFrom), so no endpoint lands
# in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
  namespace: monitoring
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-cloud
  data:
    - secretKey: username
      remoteRef:
        key: grafana-cloud/username
    - secretKey: password
      remoteRef:
        key: grafana-cloud/password
    - secretKey: loki_username
      remoteRef:
        key: grafana-cloud/loki_username
    - secretKey: prom_host
      remoteRef:
        key: grafana-cloud/prom_host
    - secretKey: loki_host
      remoteRef:
        key: grafana-cloud/loki_host
