cluster:
  name: homelab

destinations:
  grafana-cloud-metrics:
    type: prometheus
    urlFrom: convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_metrics.data["prom_host"]) + "/api/prom/push"
    auth:
      type: basic
      usernameKey: username
      passwordKey: password
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring
  grafana-cloud-logs:
    type: loki
    urlFrom: convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_logs.data["loki_host"]) + "/loki/api/v1/push"
    auth:
      type: basic
      usernameKey: loki_username
      passwordKey: password
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring

clusterMetrics:
  enabled: true
  collector: alloy-metrics
  # Series-budget trims (free tier): drop per-object metrics nothing
  # charts or alerts on.
  kube-state-metrics:
    metricsTuning:
      excludeMetrics:
        - kube_pod_restart_policy
        - kube_replicaset_created
        - kube_replicaset_metadata_generation
  # The Grafana Cloud CoreDNSDown alert expects this exact job label;
  # without the scrape, absent() fires forever. Keep the request and
  # forward duration histograms (the latency alerts feed on them);
  # drop the rest of the buckets.
  kubeDNS:
    enabled: true
    jobLabel: integrations/coredns
    metricsTuning:
      excludeMetrics:
        - coredns_proxy_request_duration_seconds_bucket
        - coredns_kubernetes_dns_programming_duration_seconds_bucket
        - coredns_dns_request_size_bytes_bucket
        - coredns_dns_response_size_bytes_bucket
        - coredns_health_request_duration_seconds_bucket

# Node hardware metrics: the exporter deploys via telemetryServices;
# this feature is what scrapes it.
hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs
  # Loki's keyword detection misreads lines that contain err=null or
  # "error":null as errors. Extract the real level from the two
  # formats that produce those lines (klog severity prefix,
  # pipe-delimited level token) and ship it as structured metadata;
  # unmatched lines keep Loki's detection. The chart runs this value
  # through Helm tpl, so the Alloy template hides in backticks. The
  # last regex re-captures only a non-empty level: structured
  # metadata with an empty value makes Loki reject the line.
  extraLogProcessingStages: |
    // Strip ANSI color codes first: colorized apps (profilarr) hide
    // their level token inside escape sequences, which breaks the
    // level regexes below and line filters in queries.
    stage.decolorize {}
    // Known-benign noise, dropped before shipping. Each drop is
    // namespace-scoped so the pattern cannot hide similar lines from
    // other apps.
    // The ArgoCD config validator runs before $secret:key
    // substitution and warns on every settings reload.
    // TODO: remove this drop when the upstream fix ships in the
    // deployed ArgoCD version:
    // https://github.com/argoproj/argo-cd/pull/29443
    stage.match {
      selector = "{namespace=\"argocd\"}"
      stage.drop {
        expression = ".*Failed to validate OIDC config.*"
      }
    }
    // The tsnet proxy logs an error whenever a client disconnects
    // mid-request (closed tab); harmless and constant on ingress.
    stage.match {
      selector = "{namespace=\"tailscale\"}"
      stage.drop {
        expression = ".*http: proxy error: context canceled.*"
      }
    }
    stage.regex {
      expression = "^(?P<klog_severity>[IWEF])[0-9]{4} "
    }
    stage.regex {
      expression = " \\| (?P<pipe_severity>TRACE|DEBUG|INFO|WARNING|WARN|ERROR|FATAL) \\| "
    }
    stage.template {
      source   = "level"
      template = "{{ `{{if eq .klog_severity \"I\"}}info{{else if eq .klog_severity \"W\"}}warn{{else if eq .klog_severity \"E\"}}error{{else if eq .klog_severity \"F\"}}fatal{{else if .pipe_severity}}{{.pipe_severity}}{{end}}` }}"
    }
    stage.regex {
      source     = "level"
      expression = "(?P<log_level>.+)"
    }
    stage.structured_metadata {
      values = { level = "log_level" }
    }

# Manifest snapshots on change: records what actually changed live
# (operators, kubectl surgery) alongside what git intended.
kubernetesManifests:
  enabled: true
  collector: alloy-singleton

# Scrape anything carrying k8s.grafana.com/scrape annotations
# (velero, argocd, external-secrets).
annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics

# The collectors' own health metrics (the "Grafana Alloy" status
# card feeds on alloy_build_info).
integrations:
  collector: alloy-metrics
  alloy:
    instances:
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name:
            - alloy-metrics
            - alloy-singleton
            - alloy-logs
        # The two component histograms are ~60% of the alloy job's
        # series; the status card only needs alloy_build_info.
        metricsTuning:
          excludeMetrics:
            - alloy_component_dependencies_wait_seconds_bucket
            - alloy_component_evaluation_seconds_bucket

collectors:
  alloy-metrics:
    presets: [small, clustered, statefulset]
  alloy-singleton:
    presets: [singleton]
  alloy-logs:
    presets: [filesystem-log-reader, daemonset]

telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
  k8s-manifest-tail:
    deploy: true
    config:
      # The chart excludes kube-system by default. This repo deploys
      # cilium and intel-gpu-plugin there, so watch all namespaces.
      excludeNamespaces: []
      objects:
        - {apiVersion: v1, kind: Pod}
        - {apiVersion: apps/v1, kind: Deployment}
        - {apiVersion: apps/v1, kind: StatefulSet}
        - {apiVersion: apps/v1, kind: DaemonSet}
