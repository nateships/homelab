# MariaDB credentials from the "birdnet-go" 1Password item; birdnet's
# own mysql settings (host, user, password) live in its config UI.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: birdnet-go
  namespace: birdnet-go
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: birdnet-go
  data:
    - secretKey: db_user
      remoteRef:
        key: birdnet-go/username
    - secretKey: db_password
      remoteRef:
        key: birdnet-go/password
    - secretKey: db_root_password
      remoteRef:
        key: birdnet-go/root_password
    - secretKey: db_name
      remoteRef:
        key: birdnet-go/database
