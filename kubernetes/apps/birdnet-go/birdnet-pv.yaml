# Static NFS volume: pods mount the export directly (NFSv4.1 client
# is in the Talos kernel; no CSI). One PV binds one PVC, so each
# consuming namespace carries its own pair against the same export.
# storageClassName "" keeps the default StorageClass from capturing
# the claim; Retain because the clip library outlives any cluster.
# site-specific: NFS server address and export path (docs/SITE.md)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: birdnet-go-clips
spec:
  capacity:
    storage: 100Gi # informational for a static NFS volume
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.16.10.100
    path: /volume1/birdnet
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clips
  namespace: birdnet-go
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: birdnet-go-clips
  resources:
    requests:
      storage: 100Gi
