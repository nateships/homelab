controllers:
  birdnet-go:
    containers:
      app:
        image:
          repository: ghcr.io/tphakala/birdnet-go
          # renovate: datasource=docker depName=ghcr.io/tphakala/birdnet-go versioning=loose
          tag: 20260823@sha256:233b94f1d3b27b261ec8d997364db0cb953f3e3b3362a89e9e22ad4a589143d6
        env:
          TZ: America/New_York
          # The pod user has no home; viper resolves the config dir
          # from XDG paths.
          HOME: /config
          XDG_CONFIG_HOME: /config
          XDG_DATA_HOME: /data
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: birdnet-go
    ports:
      http:
        port: 8080
ingress:
  app:
    className: tailscale
    annotations:
      # Served as a Tailscale Service by the shared ProxyGroup.
      tailscale.com/proxy-group: ingress
      # Advertise before the cert exists: HTTPS-only services deadlock
      # on first deploy (no advertise without cert, no cert without
      # advertise). The tailnet transport is encrypted regardless.
      tailscale.com/http-endpoint: enabled
    # The tailscale controller ignores host-bearing rules; the tailnet
    # name comes from tls.hosts and the backend is the default.
    defaultBackend:
      service:
        name: birdnet-go
        port:
          number: 8080
    tls:
      - hosts: [birdnet]
persistence:
  config:
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      birdnet-go:
        app:
          - path: /config
  data:
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      birdnet-go:
        app:
          - path: /data
  # Existing clip library on the NFS export; the clips path in the
  # app settings is /data/clips.
  clips:
    existingClaim: clips
    advancedMounts:
      birdnet-go:
        app:
          - path: /data/clips
            subPath: clips
  # birdnet writes temp audio while analyzing.
  tmp:
    type: emptyDir
    advancedMounts:
      birdnet-go:
        app:
          - path: /tmp
