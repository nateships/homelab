# API key from the "radarr" 1Password item; the pod pins it via
# RADARR__AUTH__APIKEY and consuming apps read the same item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
  namespace: radarr
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: radarr
  data:
    - secretKey: api_key
      remoteRef:
        key: radarr/password
