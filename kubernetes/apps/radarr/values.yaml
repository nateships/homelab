controllers:
  radarr:
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/radarr
          # renovate: datasource=docker depName=ghcr.io/home-operations/radarr
          tag: 6.4.3.10645@sha256:0ebb4ae26ee9522674a4ad1855e926fd6b97c534ff982644c9c9a87bca740077
        env:
          TZ: America/New_York
          # Auth is the tailnet ingress; the UI trusts it (the API
          # stays key-protected).
          RADARR__AUTH__METHOD: External
          RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
          # Pinned config-plane settings; env beats the restored
          # config.xml. URLBASE stays empty behind the tailnet
          # ingress; the port matches the service and probes.
          RADARR__SERVER__PORT: "7878"
          RADARR__SERVER__URLBASE: ""
          RADARR__LOG__ANALYTICSENABLED: "False"
          RADARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: radarr
                key: api_key
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  annotations:
    # Library and scratch volumes stay out of velero's file backups.
    backup.velero.io/backup-volumes-excludes: media,tmp
  # Media-stack identity: files on the media export are UID 1024 / GID 100.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1024
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: radarr
    ports:
      http:
        port: 7878
ingress:
  app:
    className: tailscale
    annotations:
      # Served as a Tailscale Service by the shared ProxyGroup.
      tailscale.com/proxy-group: ingress
      # Advertise before the cert exists: HTTPS-only services deadlock
      # on first deploy (no advertise without cert, no cert without
      # advertise). The tailnet transport is encrypted regardless.
      tailscale.com/http-endpoint: enabled
    # The tailscale controller ignores host-bearing rules; the tailnet
    # name comes from tls.hosts and the backend is the default.
    defaultBackend:
      service:
        name: radarr
        port:
          number: 7878
    tls:
      - hosts: [radarr]
persistence:
  config:
    accessMode: ReadWriteOnce
    size: 5Gi
  # readOnlyRootFilesystem needs a writable /tmp.
  tmp:
    type: emptyDir
  media:
    existingClaim: media
    globalMounts:
      # Whole export: imports hardlink from the usenet tree into the
      # library, which only works within one mount.
      - path: /data
