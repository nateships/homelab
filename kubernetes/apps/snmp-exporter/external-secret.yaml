# SNMPv3 credentials from the snmp 1Password item, rendered as a
# config fragment. The exporter merges it over the bundled snmp.yml,
# and scrape requests select it with ?auth=nfs_v3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp-exporter
  namespace: snmp-exporter
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: snmp-exporter
    template:
      data:
        auth.yml: |
          auths:
            nfs_v3:
              version: 3
              security_level: authPriv
              username: "{{ .username }}"
              password: "{{ .authpass }}"
              auth_protocol: SHA
              priv_protocol: AES
              priv_password: "{{ .privpass }}"
  data:
    - secretKey: username
      remoteRef:
        key: snmp/username
    - secretKey: authpass
      remoteRef:
        key: snmp/config/auth-password
    - secretKey: privpass
      remoteRef:
        key: snmp/config/priv-password
