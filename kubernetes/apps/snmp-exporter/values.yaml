controllers:
  snmp-exporter:
    containers:
      app:
        image:
          repository: quay.io/prometheus/snmp-exporter
          # The main build carries the Synology string-type fixes
          # (snmp_exporter#1603) that v0.30.1 predates; without them
          # diskID labels render as hex dumps. Swap to a release pin
          # BY HAND when a release after v0.30.1 ships.
          # renovate: datasource=docker depName=quay.io/prometheus/snmp-exporter
          tag: main@sha256:34488870daaa857162d69ff348e8436a68807c5f1499b628ffa7f509c1244522
        args:
          # Bundled modules plus the credentials fragment; the files
          # merge, duplicate module names are rejected.
          - --config.file=/etc/snmp_exporter/snmp.yml
          - --config.file=/etc/snmp_exporter/auth/auth.yml
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: snmp-exporter
    ports:
      http:
        port: 9116
persistence:
  auth:
    type: secret
    name: snmp-exporter
    globalMounts:
      - path: /etc/snmp_exporter/auth
