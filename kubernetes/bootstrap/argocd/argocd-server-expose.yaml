# Expose the ArgoCD UI through the Omni workload proxy:
# https://argocd.omni.nate.cx, authenticated by Omni (tsidp).
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    omni-kube-service-exposer.sidero.dev/port: "50080:80"
    omni-kube-service-exposer.sidero.dev/label: ArgoCD
    omni-kube-service-exposer.sidero.dev/prefix: argocd
