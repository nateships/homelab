# OIDC login against tsidp, ArgoCD-native (no Dex). The values resolve
# from the argocd-tsidp secret (ESO, kubernetes/apps/argocd). The
# hostAliases patch resolves the issuer FQDN. Without the secret, OIDC
# login is unavailable; the local admin account works.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # site-specific: the tailnet name of the argocd ingress (docs/SITE.md)
  url: https://argocd.tail34eda.ts.net
  oidc.config: |
    name: Tailscale
    issuer: $argocd-tsidp:issuer
    clientID: $argocd-tsidp:clientID
    clientSecret: $argocd-tsidp:clientSecret
    requestedScopes: [openid, profile, email]
