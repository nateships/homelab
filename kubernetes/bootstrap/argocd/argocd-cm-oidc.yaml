# OIDC login against tsidp, ArgoCD-native (no Dex). Issuer, client ID,
# and client secret resolve from the argocd-tsidp secret (delivered by
# ESO, see kubernetes/apps/argocd/config/). The server resolves the
# issuer FQDN through a hostAliases patch (argocd-server-hostaliases).
# Until the secret exists, OIDC login is unavailable and the local
# admin account still works.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: https://argocd.omni.nate.cx
  oidc.config: |
    name: Tailscale
    issuer: $argocd-tsidp:issuer
    clientID: $argocd-tsidp:clientID
    clientSecret: $argocd-tsidp:clientSecret
    requestedScopes: [openid, profile, email]
