# The k8s-bootstrap stack applies this once on a bare cluster. After
# that, the argocd Application (apps/argocd) syncs this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Pin to a release; check https://github.com/argoproj/argo-cd/releases
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/manifests/install.yaml
  # Generates the Applications from kubernetes/apps/*/config.yaml
  - appset.yaml
  # ArgoCD UI as a Tailscale Service
  - argocd-server-ingress.yaml
  # GitHub webhook secret into argocd-secret
  - argocd-webhook-secret.yaml

patches:
  - path: argocd-server-replicas.yaml
  - path: argocd-cmd-params.yaml
  - path: argocd-cm-oidc.yaml
  - path: argocd-cm-kustomize.yaml
  - path: argocd-cm-exec.yaml
  - path: argocd-rbac.yaml
  # Upstream ships the server ClusterRole without pods/exec.
  - target:
      kind: ClusterRole
      name: argocd-server
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: [""]
          resources: [pods/exec]
          verbs: [create]
  # Metrics via the monitoring chart's annotation autodiscovery; one
  # shared job label so dashboards select all four components.
  - target:
      kind: Service
      name: argocd-metrics
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          k8s.grafana.com/scrape: "true"
          k8s.grafana.com/metrics.portNumber: "8082"
          k8s.grafana.com/job: integrations/argocd
  - target:
      kind: Service
      name: argocd-server-metrics
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          k8s.grafana.com/scrape: "true"
          k8s.grafana.com/metrics.portNumber: "8083"
          k8s.grafana.com/job: integrations/argocd
  - target:
      kind: Service
      name: argocd-repo-server
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          k8s.grafana.com/scrape: "true"
          k8s.grafana.com/metrics.portNumber: "8084"
          k8s.grafana.com/job: integrations/argocd
  - target:
      kind: Service
      name: argocd-applicationset-controller
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          k8s.grafana.com/scrape: "true"
          k8s.grafana.com/metrics.portNumber: "8080"
          k8s.grafana.com/job: integrations/argocd
