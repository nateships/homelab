# Bootstrap entry point AND live source of truth: the k8s-bootstrap
# stack kubectl-applies this once on a bare cluster; afterwards the
# argocd Application (generated by the ApplicationSet below, defined in
# apps/argocd) syncs this same directory forever. Edits here flow
# through GitOps like any app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Pin to a release; check https://github.com/argoproj/argo-cd/releases
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.1/manifests/install.yaml
  # Generates the Applications from kubernetes/apps/*/config.yaml
  - appset.yaml

patches:
  - path: argocd-server-expose.yaml
  - path: argocd-server-hostaliases.yaml
  - path: argocd-cmd-params.yaml
  - path: argocd-cm-oidc.yaml
  - path: argocd-cm-kustomize.yaml
  - path: argocd-rbac.yaml
