# Pods cannot resolve the tsidp issuer FQDN: ts.net names are not in
# public DNS, and MagicDNS never reaches the cluster DNS chain (CoreDNS
# forwards to Talos hostDNS, which only reads machine-config
# nameservers). The nodes route 100.64.0.0/10 over the tailnet
# (tailscale extension), so a static hosts entry on the one OIDC
# consumer is enough. The FQDN is public knowledge regardless: tsidp's
# Let's Encrypt certificate put it in the Certificate Transparency logs.
# If the tsidp tailnet IP ever changes, update it here.
# site-specific: tsidp FQDN and tailnet IP (docs/SITE.md)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      hostAliases:
        - ip: 100.84.16.7
          hostnames:
            - tsidp.tail34eda.ts.net
