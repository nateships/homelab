# ts.net names do not resolve in public DNS. This entry resolves the
# tsidp issuer FQDN for argocd-server; the nodes route 100.64.0.0/10
# over the tailnet. Update the IP here if the tsidp device changes.
# site-specific: tsidp FQDN and tailnet IP (docs/SITE.md)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      hostAliases:
        - ip: 100.84.16.7
          hostnames:
            - tsidp.tail34eda.ts.net
