# GitHub webhook shared secret; the cloudflare stack mints the
# argocd-webhook item. Merge policy: argocd-secret already exists from
# the install manifests, ESO only adds this key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook
  namespace: argocd
spec:
  refreshInterval: 1h # keep >= 1h: Family-plan rate limits
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: argocd-webhook/password
