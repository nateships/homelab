# Generates one Application per kubernetes/apps/<name>/config.yaml.
# A config file carries only what differs per app (name, namespace,
# sources, optional ignoreDifferences, optional autosync: false,
# optional namespaceLabels for e.g. a privileged PSA namespace);
# this template owns the shared sync policy. Prune stays off: resources
# removed from git linger until pruned by hand in the UI or CLI.
# Deleting a config file still deletes the whole Application.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/nateships/homelab
        revision: main
        files:
          - path: kubernetes/apps/*/config.yaml
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Large CRDs (ArgoCD, Cilium, ESO) overflow client-side
          # apply annotations
          - ServerSideApply=true
          # Keep syncs from reverting fields listed in ignoreDifferences
          # (e.g. the operator-managed externalName on egress Services)
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
  # Sources (and optional ignoreDifferences) are nested YAML; the flat
  # template fields above cannot carry them, so this patch injects them
  # verbatim.
  templatePatch: |
    spec:
      sources:
    {{- .sources | toYaml | nindent 4 }}
    {{- if hasKey . "ignoreDifferences" }}
      ignoreDifferences:
    {{- .ignoreDifferences | toYaml | nindent 4 }}
    {{- end }}
    {{- if or (hasKey . "namespaceLabels") (and (hasKey . "autosync") (not .autosync)) }}
      syncPolicy:
    {{- if and (hasKey . "autosync") (not .autosync) }}
        automated: null
    {{- end }}
    {{- if hasKey . "namespaceLabels" }}
        # Labels for the namespace CreateNamespace makes (PSA level etc.)
        managedNamespaceMetadata:
          labels:
    {{- .namespaceLabels | toYaml | nindent 10 }}
    {{- end }}
    {{- end }}
