# Generates one Application for each
# kubernetes/apps/<category>/<name>/config.yaml. The category folder
# (infra|network|storage|media|utility) becomes the Application's category
# label, for UI filtering.
# Config keys (CI validates the schema):
#   name, namespace   required
#   sources           optional; default is the app directory, rendered
#                     by its kustomization.yaml. Local sources can omit
#                     repoURL and targetRevision.
#   ignoreDifferences optional, passed through
#   autosync: false   optional; disables automated sync
#   namespaceLabels   optional; labels for the created namespace
#   labels            optional; extra labels on the generated Application
#   url               optional; the app's UI, shown as a launch icon on
#                     the Application. Needed for tailscale ingresses:
#                     their class ignores host rules, so ArgoCD cannot
#                     derive an external URL from the Ingress.
# Prune is off: resources removed from git stay until manual pruning.
# Deletion of a config file deletes the Application.
# preserveResourcesOnDeletion keeps app resources if someone deletes
# this ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  # Manual autosync toggles on generated Applications survive (e.g.
  # pausing for maintenance); config.yaml autosync stays the initial
  # state, and a manual toggle wins until reverted. Only the automated
  # field is ignored: a wider pointer also freezes
  # managedNamespaceMetadata, so namespaceLabels edits never reach
  # existing Applications.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy/automated
  generators:
    - git:
        repoURL: https://github.com/nateships/homelab
        revision: main
        files:
          - path: kubernetes/apps/*/*/config.yaml
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Large CRDs (ArgoCD, Cilium, ESO) overflow client-side
          # apply annotations
          - ServerSideApply=true
          # Keep syncs from reverting fields listed in ignoreDifferences
          # (e.g. the operator-managed externalName on egress Services)
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
  # The flat template fields cannot carry nested YAML; this patch
  # injects it. The patch strategic-merges into the template.
  templatePatch: |
    metadata:
      labels:
        category: {{ index .path.segments 2 }}
    {{- if hasKey . "labels" }}
    {{- get . "labels" | toYaml | nindent 8 }}
    {{- end }}
    {{- if hasKey . "url" }}
      annotations:
        link.argocd.argoproj.io/external-link: "{{ .url }}"
    {{- end }}
    spec:
      sources:
    {{- /* sprig get, not .sources: missingkey=error rejects absent keys */}}
    {{- range (get . "sources" | default (list (dict "path" .path.path))) }}
      - {{- mergeOverwrite (dict "repoURL" "https://github.com/nateships/homelab" "targetRevision" "main") . | toYaml | nindent 8 }}
    {{- end }}
    {{- if hasKey . "ignoreDifferences" }}
      ignoreDifferences:
    {{- .ignoreDifferences | toYaml | nindent 4 }}
    {{- end }}
    {{- if or (hasKey . "namespaceLabels") (and (hasKey . "autosync") (not .autosync)) }}
      syncPolicy:
    {{- if and (hasKey . "autosync") (not .autosync) }}
        automated: null
    {{- end }}
    {{- if hasKey . "namespaceLabels" }}
        managedNamespaceMetadata:
          labels:
    {{- .namespaceLabels | toYaml | nindent 10 }}
    {{- end }}
    {{- end }}
