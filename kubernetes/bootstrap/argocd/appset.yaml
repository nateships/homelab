# Generates one Application per kubernetes/apps/<name>/config.yaml.
# A config file carries only what differs per app; this template owns
# the shared sync policy. Config keys (CI validates the schema):
#   name, namespace   required
#   sources           optional; defaults to the app's own directory
#                     (kubernetes/apps/<name>, rendered by its
#                     kustomization.yaml). When given, local-repo
#                     sources may omit repoURL and targetRevision
#                     (defaulted in templatePatch below)
#   ignoreDifferences optional, passed through
#   autosync: false   optional, turns off automated sync for the app
#   namespaceLabels   optional, labels for the auto-created namespace
#                     (e.g. a privileged PSA level)
# Prune stays off: resources removed from git linger until pruned by
# hand in the UI or CLI. Deleting a config file still deletes the whole
# Application; preserveResourcesOnDeletion keeps an accidental deletion
# of this ApplicationSet from cascading into every app's resources.
#
# MIGRATION WARNING: the generator reads config.yaml from git instantly,
# but this template only updates when the argocd app syncs it. A change
# that touches the templatePatch AND the config.yaml schema together can
# deadlock the self-management loop (old template + new configs =
# invalid argocd Application = nothing left to deliver the new
# template). After merging such a change, run once:
#   kubectl apply --server-side -n argocd -f kubernetes/bootstrap/argocd/appset.yaml
# and force a reconcile with the argocd.argoproj.io/application-set-refresh
# annotation if apps stay stale.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/nateships/homelab
        revision: main
        files:
          - path: kubernetes/apps/*/config.yaml
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Large CRDs (ArgoCD, Cilium, ESO) overflow client-side
          # apply annotations
          - ServerSideApply=true
          # Keep syncs from reverting fields listed in ignoreDifferences
          # (e.g. the operator-managed externalName on egress Services)
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
  # Sources and the optional keys are nested YAML; the flat template
  # fields above cannot carry them, so this patch injects them. The
  # patch strategic-merges into the template, so the shared syncPolicy
  # keys survive the conditional additions.
  templatePatch: |
    spec:
      sources:
    {{- /* sprig get, not .sources: missingkey=error fires on absent map keys */}}
    {{- range (get . "sources" | default (list (dict "path" (printf "kubernetes/apps/%s" .name)))) }}
      - {{- mergeOverwrite (dict "repoURL" "https://github.com/nateships/homelab" "targetRevision" "main") . | toYaml | nindent 8 }}
    {{- end }}
    {{- if hasKey . "ignoreDifferences" }}
      ignoreDifferences:
    {{- .ignoreDifferences | toYaml | nindent 4 }}
    {{- end }}
    {{- if or (hasKey . "namespaceLabels") (and (hasKey . "autosync") (not .autosync)) }}
      syncPolicy:
    {{- if and (hasKey . "autosync") (not .autosync) }}
        automated: null
    {{- end }}
    {{- if hasKey . "namespaceLabels" }}
        # Labels for the namespace CreateNamespace makes (PSA level etc.)
        managedNamespaceMetadata:
          labels:
    {{- .namespaceLabels | toYaml | nindent 10 }}
    {{- end }}
    {{- end }}
