# Repo toolchain: `mise install` gets you everything.
# CI installs from this same file (jdx/mise-action), so versions live here only.
[tools]
opentofu = "1.12"
# MUST match OMNI_IMG_TAG in omni/omni.env.example; mismatched omnictl fails
# with obscure gRPC errors
omnictl = "1.10.4"
# match talos.version in omni/cluster-template/cluster.yaml
talosctl = "1.13.9"
# within one minor of kubernetes.version in the cluster template
kubectl = "1.36"
kubeconform = "0.8.0"
# exact version required: this aqua package can't enumerate releases.
# Renovate tracks it through the 1password/op Docker image tags (see
# .github/renovate.json5), grouped with the runner Dockerfile's OP_VERSION.
"aqua:1password/cli" = "2.32.0"
prek = "0.4.14"
trufflehog = "3.97.0"
