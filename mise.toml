# Repo toolchain: `mise install` gets you everything.
# CI installs from this same file (jdx/mise-action), so versions live here only.
[tools]
opentofu = "1.12.6"
# MUST match OMNI_IMG_TAG in omni/omni.env.example; mismatched omnictl fails
# with obscure gRPC errors
omnictl = "1.10.5"
# match talos_version in infra/stacks/cluster/main.tf
talosctl = "1.13.9"
# within one minor of kubernetes_version in infra/stacks/cluster/main.tf
kubectl = "1.36"
helm = "4.2.4"
kubeconform = "0.8.0"
# Exact version required: this aqua package cannot enumerate releases.
# Renovate tracks it through the 1password/op Docker image tags.
"aqua:1password/cli" = "2.39.0"
prek = "0.5.1"
trufflehog = "3.97.1"
trivy = "0.74.0"
zizmor = "1.30.0"
"pipx:yamllint" = "1.38.0"

# Runner-image tools (runner/Dockerfile installs this whole file via mise)
"aqua:tailscale/tailscale" = "1.102.3"
# uv powers the pipx backend
uv = "0.12.8"
"pipx:ansible-core" = "2.21.3"
# Spacelift's ansible workflow drives playbooks through ansible-runner
"pipx:ansible-runner" = "2.4.3"
