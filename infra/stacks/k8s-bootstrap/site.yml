---
# Bootstraps GitOps onto the cluster: ArgoCD (with the ApplicationSet that
# generates all apps), its repo credential, and the one secret ESO needs.
# Runs on the runner against an Omni service-account kubeconfig; re-running
# on a healthy cluster is a no-op.
- name: Kubernetes bootstrap
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../../.."
    kubeconfig: /tmp/omni-kubeconfig
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Fetch a service-account kubeconfig from Omni
      ansible.builtin.shell: |
        set -eu
        export OMNI_ENDPOINT="https://$(op read op://homelab/omni/domain)"
        export OMNI_SERVICE_ACCOUNT_KEY="$(op read op://homelab/omni-service-account/password)"
        omnictl kubeconfig --cluster homelab --service-account --user k8s-bootstrap --force "{{ kubeconfig }}"
      changed_when: false

    # The first apply can race the fresh ApplicationSet CRD; retry covers it.
    - name: Install ArgoCD and the ApplicationSet
      ansible.builtin.command: kubectl apply --server-side --force-conflicts -k "{{ repo_root }}/kubernetes/bootstrap/argocd"
      register: argocd
      retries: 3
      delay: 10
      until: argocd.rc == 0
      changed_when: "'serverside-applied' in argocd.stdout"

    # The repo is private; the git generator and the app sources need this
    # credential. GitHub App auth: Contents read-only, this repo only.
    # TODO(public): remove this task, the GitHub App, the github-argocd
    # item, and the github-argocd-key document once the repo is public.
    - name: Create the ArgoCD repo credential
      # Assignments first: `set -e` then aborts when an op read fails, so a
      # 1Password error can not apply a secret with empty values.
      ansible.builtin.shell: |
        set -eu
        app_id="$(op read 'op://homelab/github-argocd/app-id')"
        install_id="$(op read 'op://homelab/github-argocd/installation-id')"
        private_key="$(op document get github-argocd-key --vault homelab)"
        kubectl create secret generic repo-homelab \
          --namespace argocd \
          --from-literal=type=git \
          --from-literal=url=https://github.com/nateships/homelab \
          --from-literal=githubAppID="$app_id" \
          --from-literal=githubAppInstallationID="$install_id" \
          --from-literal=githubAppPrivateKey="$private_key" \
          --dry-run=client -o yaml \
          | kubectl label --local -f - argocd.argoproj.io/secret-type=repository -o yaml \
          | kubectl apply -f -
      register: repo_cred
      changed_when: "'created' in repo_cred.stdout or 'configured' in repo_cred.stdout"
      no_log: true

    - name: Create the external-secrets namespace
      ansible.builtin.shell: >-
        kubectl create namespace external-secrets --dry-run=client -o yaml
        | kubectl apply -f -
      register: ns
      changed_when: "'created' in ns.stdout or 'configured' in ns.stdout"

    - name: Create the 1Password token secret for ESO
      # `set -u` fails the task when the run environment lacks the token,
      # instead of applying an empty secret.
      ansible.builtin.shell: |
        set -eu
        kubectl create secret generic onepassword-service-account \
          --namespace external-secrets \
          --from-literal=token="$OP_SERVICE_ACCOUNT_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -
      register: eso_secret
      changed_when: "'created' in eso_secret.stdout or 'configured' in eso_secret.stdout"
      no_log: true
