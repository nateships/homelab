---
# Configures the Omni LXC (created by infra/stacks/omni) and deploys Omni.
# Targets only the PVE host over Tailscale SSH; all LXC work goes
# through pct. Secrets render on the runner with op and are pushed in.
- name: Omni LXC configuration and deployment
  hosts: pve1
  gather_facts: false
  vars:
    # Single source: the admin stack shares TF_VAR_omni_ct_id with every
    # stack; the same value feeds infra/stacks/omni. Default 200.
    ct_id: "{{ lookup('env', 'TF_VAR_omni_ct_id') | default('200', true) }}"
    repo_root: "{{ playbook_dir }}/../../.."
  tasks:
    # set_fact evaluates each lookup once; a lookup in vars runs again
    # on every reference (one op API call each time).
    - name: Read the Omni identity from 1Password
      ansible.builtin.set_fact:
        omni_domain: "{{ lookup('pipe', 'op read op://homelab/omni/domain') }}"
        admin_email: "{{ lookup('pipe', 'op read op://homelab/omni/admin-email') }}"
      check_mode: false
    - name: Pass /dev/net/tun into the LXC
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ ct_id }}.conf"
        regexp: "^dev0:"
        line: "dev0: path=/dev/net/tun"
      register: tun

    - name: Enable keyctl and nesting (the API token cannot set keyctl)
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ ct_id }}.conf"
        regexp: "^features:"
        line: "features: keyctl=1,nesting=1"
      register: feat

    - name: Reboot the LXC to apply device and features
      ansible.builtin.command: "pct reboot {{ ct_id }}"
      when: tun is changed or feat is changed

    # Read-only probes run even in check mode (skipped probes register no
    # stdout/rc and break the conditions that use them).
    - name: Wait until the LXC runs
      ansible.builtin.command: "pct status {{ ct_id }}"
      register: ct_status
      until: "'running' in ct_status.stdout"
      retries: 10
      delay: 3
      changed_when: false
      check_mode: false

    - name: Check for the required packages in the LXC
      ansible.builtin.command: >-
        pct exec {{ ct_id }} -- sh -c
        'command -v curl && command -v certbot && command -v gpg
        && test -e /usr/lib/python3/dist-packages/certbot_dns_cloudflare'
      register: pkgs
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Install packages in the LXC
      ansible.builtin.command: >-
        pct exec {{ ct_id }} -- sh -c
        'apt-get update -q && apt-get install -qy curl ca-certificates certbot python3-certbot-dns-cloudflare gpg'
      when: pkgs.rc != 0

    - name: Check for Docker in the LXC
      ansible.builtin.command: "pct exec {{ ct_id }} -- sh -c 'command -v docker'"
      register: docker_bin
      failed_when: false
      changed_when: false
      check_mode: false

    # The trailing `command -v docker` makes a silent curl/sh failure fatal.
    - name: Install Docker in the LXC
      ansible.builtin.command: >-
        pct exec {{ ct_id }} -- sh -c
        'curl -fsSL https://get.docker.com | sh && command -v docker'
      when: docker_bin.rc != 0

    - name: Check for Tailscale in the LXC
      ansible.builtin.command: "pct exec {{ ct_id }} -- sh -c 'command -v tailscale'"
      register: ts_bin
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Install Tailscale in the LXC
      ansible.builtin.command: >-
        pct exec {{ ct_id }} -- sh -c
        'curl -fsSL https://tailscale.com/install.sh | sh && command -v tailscale'
      when: ts_bin.rc != 0

    - name: Check the tailnet connection of the LXC
      ansible.builtin.command: "pct exec {{ ct_id }} -- tailscale status"
      register: ts_status
      failed_when: false
      changed_when: false
      check_mode: false

    # Non-ephemeral server node; MagicDNS from the LXC lets the Omni
    # container resolve the tsidp issuer URL.
    - name: Join the LXC to the tailnet
      ansible.builtin.command: >-
        pct exec {{ ct_id }} -- tailscale up
        --auth-key="{{ lookup('pipe', 'op read op://homelab/tailscale-omni/password') }}?ephemeral=false&preauthorized=true"
        --advertise-tags=tag:omni --hostname=omni
      when: ts_status.rc != 0
      no_log: true

    - name: Create the Omni directories in the LXC
      ansible.builtin.command: >-
        pct exec {{ ct_id }} -- sh -c
        'mkdir -p /etc/omni/sqlite /etc/etcd && chown 1000:1000 /etc/etcd && chmod 700 /etc/etcd'
      changed_when: false

    # The `always` block removes the staged plaintext secrets even when a
    # push fails; they must not persist on the PVE host.
    - name: Stage and push the secret files
      block:
        - name: Stage secrets and config on the PVE host
          ansible.builtin.copy:
            dest: "/tmp/omni-stage-{{ item.name }}"
            content: "{{ item.content }}"
            mode: "0600"
          loop:
            - name: cloudflare.ini
              content: |
                dns_cloudflare_api_token = {{ lookup('pipe', 'op read op://homelab/cloudflare/dns-api-token') }}
            - name: omni.asc
              content: "{{ lookup('pipe', 'op document get omni-gpg --vault homelab') }}"
            - name: omni.env
              content: "{{ lookup('pipe', 'op inject -i ' ~ repo_root ~ '/omni/omni.env.example') }}"
            - name: docker-compose.yml
              content: "{{ lookup('file', repo_root ~ '/omni/docker-compose.yml') }}"
            - name: provider-config.yaml
              content: "{{ lookup('pipe', 'op inject -i ' ~ repo_root ~ '/omni/provider-config.yaml') }}"
          loop_control:
            label: "{{ item.name }}"
          no_log: true

        - name: Push the files into the LXC
          ansible.builtin.command: >-
            pct push {{ ct_id }} /tmp/omni-stage-{{ item.src }} {{ item.dest }}
            --perms {{ item.perms }}
          loop:
            - { src: cloudflare.ini, dest: /root/cloudflare.ini, perms: "600" }
            - { src: omni.asc, dest: /etc/omni/omni.asc, perms: "600" }
            - { src: omni.env, dest: /etc/omni/omni.env, perms: "600" }
            - { src: docker-compose.yml, dest: /etc/omni/docker-compose.yml, perms: "644" }
            - { src: provider-config.yaml, dest: /etc/omni/provider-config.yaml, perms: "600" }
      always:
        - name: Remove the staged files from the PVE host
          ansible.builtin.file:
            path: "/tmp/omni-stage-{{ item }}"
            state: absent
          loop: [cloudflare.ini, omni.asc, omni.env, docker-compose.yml, provider-config.yaml]

    # Wildcard included: the workload service proxy serves apps on
    # <name>.{{ omni_domain }}. --keep-until-expiring makes this a no-op
    # when the cert already covers both names; --expand reissues when the
    # name set grows.
    - name: Issue the TLS certificate (idempotent)
      ansible.builtin.command: >-
        pct exec {{ ct_id }} -- certbot certonly --dns-cloudflare
        --dns-cloudflare-credentials /root/cloudflare.ini
        --cert-name {{ omni_domain }}
        -d {{ omni_domain }} -d '*.{{ omni_domain }}'
        --expand --keep-until-expiring
        -m {{ admin_email }} --agree-tos -n
      register: cert
      changed_when: "'not yet due' not in cert.stdout"

    - name: Install the certbot deploy hook (restart Omni on renewal)
      ansible.builtin.command: >-
        pct exec {{ ct_id }} -- sh -c
        'printf "#!/bin/sh\ncd /etc/omni && docker compose --env-file omni.env restart omni\n" > /etc/letsencrypt/renewal-hooks/deploy/restart-omni.sh && chmod 755 /etc/letsencrypt/renewal-hooks/deploy/restart-omni.sh'
      changed_when: false

    - name: Deploy Omni (compose pull and up)
      ansible.builtin.command: >-
        pct exec {{ ct_id }} -- sh -c
        'cd /etc/omni && docker compose --env-file omni.env pull -q && docker compose --env-file omni.env up -d'
