# Stack manifest: hydrated by the admin stack (infra/spacelift).
description: Omni LXC configuration and deployment (Ansible over Tailscale SSH)
type: ansible
playbook: site.yml
labels: [op]
depends_on: [omni]
env:
  # Spacelift's workspace is world-writable, so ansible ignores a cwd
  # ansible.cfg; an explicit path is honored.
  ANSIBLE_CONFIG: ansible.cfg
project_globs: [omni/**]
