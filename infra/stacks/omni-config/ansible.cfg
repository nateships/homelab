[defaults]
inventory = inventory.yml
retry_files_enabled = False
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
# SSH tunnels through the userspace tailscaled started by the run hooks.
# Authentication is Tailscale SSH (identity-based); no keys exist.
ssh_args = -o ProxyCommand="tailscale --socket=/tmp/tailscaled.sock nc %h %p" -o StrictHostKeyChecking=no
