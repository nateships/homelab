[defaults]
inventory = inventory.yml
retry_files_enabled = False
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
# SSH tunnels through the userspace tailscaled started by the run hooks.
# Authentication is Tailscale SSH (identity-based); no keys exist.
# ControlPersist reuses one connection for all tasks; pipelining sends
# modules over it instead of copying temp files. Both matter on the
# proxied link.
ssh_args = -o ProxyCommand="tailscale --socket=/tmp/tailscaled.sock nc %h %p" -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/tmp/ansible-ssh-%h
pipelining = True
